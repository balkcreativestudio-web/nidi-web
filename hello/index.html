<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- nidi.life/hello (2026-11-17): the link in Maria's message to
         Once Upon (photo books). It reads as a plain greeting, so the page
         they land on does not name them. It goes to the home page with
         ?ref=hello, and HQ counts the visit and what follows under the
         "hello" row in Marketing (Once Upon). It always opens in English
         (?lang=en, which the home page drops from the address), even on a
         Spanish browser; the EN / ES switch still works (Maru, 17/11). Use it only for
         this message, so its numbers stay clean.

         A real page, so it answers 200. No tracking here: the home page
         records the visit, as with the other short links. -->
    <title>Nidi: the app for families who live far apart</title>
    <meta name="description" content="Small things to do together, every day, from both homes." />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#F4EFE7" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nidi" />
    <meta property="og:title" content="Nidi: the app for families who live far apart" />
    <meta property="og:description" content="Small things to do together, every day, from both homes." />
    <meta property="og:url" content="https://nidi.life/" />
    <meta property="og:image" content="https://nidi.life/assets/og-en.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://nidi.life/assets/og-en.png" />
    <link rel="canonical" href="https://nidi.life/" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <script>location.replace("/?ref=hello&lang=en" + location.hash);</script>
    <noscript><meta http-equiv="refresh" content="0; url=/?ref=hello&amp;lang=en" /></noscript>
    <style>html,body{margin:0;height:100%;background:#F4EFE7}a{color:#2a241e;font:16px/1.4 system-ui,sans-serif}body{display:flex;align-items:center;justify-content:center}</style>
  </head>

</html>
