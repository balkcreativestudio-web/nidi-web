<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The TikTok bio address (2026-11-16): nidi.life/tiktok. TikTok shows
         the bio's "nidi.life/tiktok" as text people type, so it has to be
         short. It goes to the home page with ?ref=tiktok, so HQ counts the
         visit and what follows under the "tiktok" row in Marketing. The home
         page then moves a Spanish browser to /es/ with the ref, as for any
         other link.

         A real page, so it answers 200 (a 404 gets no preview and can be
         refused by a platform). No tracking here: the home page records the
         visit. -->
    <title>Nidi: the app for families who live far apart</title>
    <meta name="description" content="Small things to do together, every day, from both homes." />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#F4EFE7" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nidi" />
    <meta property="og:title" content="Nidi: the app for families who live far apart" />
    <meta property="og:description" content="Small things to do together, every day, from both homes." />
    <meta property="og:url" content="https://nidi.life/" />
    <meta property="og:image" content="https://nidi.life/assets/og-en.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://nidi.life/assets/og-en.png" />
    <link rel="canonical" href="https://nidi.life/" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <script>location.replace("/?ref=tiktok" + location.hash);</script>
    <noscript><meta http-equiv="refresh" content="0; url=/?ref=tiktok" /></noscript>
    <style>html,body{margin:0;height:100%;background:#F4EFE7}a{color:#2a241e;font:16px/1.4 system-ui,sans-serif}body{display:flex;align-items:center;justify-content:center}</style>
  </head>
  <body>
    <a href="/?ref=tiktok">nidi.life</a>
  </body>
</html>
