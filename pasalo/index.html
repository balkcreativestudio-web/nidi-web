    <script>
      (function () {
        try {
          if (location.hostname.replace(/^www\./, "") !== "nidi.life") return;
          // Maru and Claude are not visitors (nidi.life/?notrack once on a device).
          if (localStorage.getItem("nidi-notrack")) return;
        } catch (e) { return; }
        var m = location.search.match(/[?&]ref=([a-z0-9_-]{1,40})(?:&|$)/i);
        var ref = m ? m[1].toLowerCase() : null;
        var tz = null;
        try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || null; } catch (e) {}
        var send = function (extra) {
          var o = { path: "/pasalo/", lang: "es", ref: ref, tz: tz };
          for (var k in extra) o[k] = extra[k];
          // credentials omitted so no vendor cookie is ever set (see the home page).
          try { fetch("https://orqdnuikcdskmvorchly.supabase.co/functions/v1/site-view", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(o), credentials: "omit", keepalive: true, mode: "cors" }).catch(function () {}); } catch (e) {}

        send({ referrer: document.referrer || null });
        // keepalive lets the tap reach site-view while the page hands over to WhatsApp.
        document.getElementById("wa").addEventListener("click", function () { send({ click: "whatsapp" }); });
