<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- GitHub Pages serves this file for every path that does not exist,
         which is how /join gets a page without a server. The script shows
         the invitation for /join (the share message's link since flow v4,
         2026-10-06), /join/invitation (the invitation email's button) and
         an old /join/<code>, and a plain not-found for anything else.
         /join/* is in /.well-known/apple-app-site-association, so on an
         iPhone with Nidi those two open the app; bare /join is not, and
         always lands here. This page is for when the app does not open
         (no app yet, or a link opened inside another app's browser). -->
    <title>nidi</title>
    <meta name="robots" content="noindex" />
    <!-- Links out of an invitation page carry at most https://nidi.life/,
         never the /join/<slug> path an old invitation link may hold. -->
    <meta name="referrer" content="origin" />
    <meta name="theme-color" content="#F4EFE7" />
    <style>
      /* One screen, nothing below the fold. The page is a grid of three
         rows — header, hero, footer — pinned to the viewport, so the
         footer sits at the bottom without absolute positioning and
         without overlapping the hero on a short screen. */
      /* Nidi's own type, as on the home page (2026-10-23): the
         invitation is the first thing of Nidi somebody sees. */
      @font-face { font-family: "Lora"; src: url(/assets/fonts/Lora-Regular.ttf) format("truetype"); font-weight: 400; font-style: normal; font-display: swap; }
      @font-face { font-family: "Lora"; src: url(/assets/fonts/Lora-Italic.ttf) format("truetype"); font-weight: 400; font-style: italic; font-display: swap; }
      @font-face { font-family: "Hanken Grotesk"; src: url(/assets/fonts/HankenGrotesk-Light.ttf) format("truetype"); font-weight: 300; font-style: normal; font-display: swap; }
      @font-face { font-family: "Hanken Grotesk"; src: url(/assets/fonts/HankenGrotesk-Medium.ttf) format("truetype"); font-weight: 500; font-style: normal; font-display: swap; }
      :root {
        --cream: #f4efe7;
        --olive: #87995b;
        --lavender: #9890b0;
        --paper: #fffdf9;
        --ink: #2a241d;
        --ink2: #7a6f62;
        --muted: #b0a596;
        /* The input's hairline. Warmer and far lighter than ink, which
           is what stops the form reading as a boxed control. */
        --field-line: #e7dfd2;
        --serif: "Lora", Georgia, "Times New Roman", serif;
        --sans: "Hanken Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        /* Cream, as in the app, so the invitation card reads as paper
           laid on it. */
        background: var(--cream);
        color: var(--ink);
      }

      body {
        /* dvh so mobile browser chrome cannot push the footer out of
           view; vh is the fallback for anything that lacks it. */
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        grid-template-rows: auto 1fr auto;
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
      }

      header {
        padding: 24px 28px 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 68px;
      }

      /* EN | ES at the foot, right, like every other page on the site
         (Maru, 2026-09-26: "bajalo en todo el sitio"). This page was
         the one left with it up top. */
      /* eyebrow. */
      .lang {
        display: flex;
        align-items: center;
        font-family: var(--sans);
        font-size: 12px;
        line-height: 14px;
        letter-spacing: 0.06em;
      }
      .lang button {
        background: none;
        border: 0;
        color: var(--ink2);
        font-size: 12px;
        line-height: 14px;
        font-weight: 500;
        min-height: 44px;
        padding: 0 12px;
      }
      .lang button[aria-pressed="true"] {
        color: var(--ink);
        font-weight: 600;
      }
      .lang .bar {
        width: 1px;
        height: 14px;
        background: var(--field-line);
      }

      /* The logotype, sized to the wordmark it replaces. It was Georgia
         20px; the logotype's x-height is two thirds of its cropped
         height, so 15px tall reproduces Georgia 20px's 9.6px x-height —
         the header keeps the same weight on the page, and only the
         letterforms change. Width follows from the 2.29:1 ink box. */
      .wordmark {
        display: block;
        height: 15px;
        width: auto;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 32px 28px;
      }

      /* Two fixed sizes rather than a clamp: the brief names 52 and 36,
         and a fluid scale would only hit those two numbers at two exact
         viewport widths. The breakpoint is the switch. */
      h1 {
        font-family: var(--serif);
        font-weight: 400;
        font-size: 44px;
        line-height: 48px;
        letter-spacing: -0.02em;
        color: var(--ink);
        margin: 0 0 40px;
        /* Each sentence on its own line; the second is bound with
           no-break spaces so no word is left alone (the widow rule). */
        max-width: 16ch;
        text-wrap: balance;
      }

      form {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
        width: 100%;
        max-width: 460px;
      }

      input[type="email"] {
        flex: 1 1 220px;
        min-width: 0;
        font-family: var(--sans);
        /* 14px on desktop; the breakpoint below takes it back to 16px
           on phones. See that block for why. */
        font-size: 14px;
        color: var(--ink);
        background: var(--paper);
        border: 1px solid var(--field-line);
        border-radius: 4px;
        padding: 14px 16px;
      }

      /* An address that cannot be sent: the field alone says so. */
      input[type="email"][aria-invalid="true"] {
        border-color: #cc644c;
        box-shadow: 0 0 0 1px #cc644c;
      }

      input[type="email"]::placeholder {
        color: var(--muted);
      }

      button {
        font-family: var(--sans);
        font-size: 14px;
        font-weight: 500;
        color: var(--paper);
        background: var(--ink);
        border: 1px solid var(--ink);
        border-radius: 4px;
        padding: 14px 22px;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.5;
        cursor: default;
      }

      /* ink2, not muted: #b0a596 measured 2.2:1 on the paper, under the
         4.5:1 body text needs. muted stays for the placeholder only. */
      .note {
        font-size: 14px;
        color: var(--ink2);
        margin: 20px 0 0;
      }

      .done {
        font-family: var(--serif);
        font-size: 18px;
        color: var(--ink);
        margin: 0;
        /* Holds the form's height so the page does not jump when the
           form is replaced. */
        min-height: 52px;
        display: flex;
        align-items: center;
      }

      .error {
        font-size: 14px;
        color: var(--ink2);
        margin: 12px 0 0;
      }

      [hidden] {
        display: none !important;
      }

      /* eyebrow. */
      footer {
        padding: 24px 28px 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        text-align: left;
        font-size: 12px;
        line-height: 14px;
        color: var(--ink2);
      }

      footer a {
        color: var(--ink);
        text-decoration: none;
        /* No rule under them (Maru, 2026-09-26). This page still had
           one. */
      }

      footer .lang button { color: var(--ink2); }
      footer .lang { margin: -15px -12px -15px 0; }

      @media (max-width: 520px) {
        footer { align-items: flex-start; }
        .foot-links .sep-studio { display: none; }
        .foot-links .studio { display: block; margin-top: 6px; }
      }

      .sep {
        padding: 0 8px;
      }

      /* The one breakpoint. It sits here, below every base rule it
         overrides: a media query carries no extra specificity, so
         placed above them it would lose the tie and silently do
         nothing.

         The input goes back up to 16px because iOS Safari zooms the
         page in when a text field smaller than that takes focus, and
         never zooms back out — which would put a jump on the one
         control this page exists for. 14px is the brand size and holds
         everywhere it can be held; the phone is where it cannot. */
      @media (max-width: 600px) {
        h1 {
          font-size: 36px;
          line-height: 40px;
        }

        input[type="email"] {
          font-size: 16px;
        }
      }

      /* Visible focus for keyboard users. The default ring is removed
         by the border styling above on some browsers. */
      a:focus-visible,
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }

      /* Focus goes back to a field that cannot be sent; its ring takes
         the error colour too, or the ink ring hides the state. */
      input[aria-invalid="true"]:focus-visible,
      input[aria-invalid="true"]:focus {
        outline: 2px solid #cc644c;
        outline-offset: 2px;
      }

      /* ── The invitation page (/join, /join/…) ───────────────────── */
      /* Option B, chosen by Maru on 2026-10-23: the invitation is a
         card, paper on cream, taped and slightly turned like the prints
         in Memory, and under it the three steps, numbered. Half the
         words it had, and the steps one per line instead of a
         paragraph. Left-aligned inside one centred column, at every
         width: the column is what centres, never the text. */
      main {
        /* The card is turned, so its corners reach a little past the
           column; clip keeps that from ever scrolling the page sideways. */
        overflow-x: clip;
      }
      .invite {
        width: 100%;
        max-width: 420px;
        text-align: left;
        font-family: var(--sans);
        font-weight: 300;
      }
      .card {
        position: relative;
        background: var(--paper);
        padding: 32px 28px 26px;
        margin: 6px 4px 40px;
        transform: rotate(-1.5deg);
        box-shadow: 0 10px 28px rgba(42, 36, 29, 0.1), 0 1px 0 rgba(42, 36, 29, 0.08);
      }
      .tape {
        position: absolute;
        top: -11px;
        right: 30px;
        width: 88px;
        height: 24px;
        background: color-mix(in srgb, var(--olive) 78%, transparent);
        transform: rotate(7deg);
      }
      .eyebrow,
      .how {
        font-family: var(--sans);
        font-weight: 500;
        font-size: 12px;
        line-height: 16px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--ink2);
        margin: 0;
      }
      .invite h1 {
        font-size: 40px;
        line-height: 46px;
        max-width: 11ch;
        margin: 12px 0 14px;
      }
      .lede {
        font-family: var(--serif);
        font-style: italic;
        font-size: 19px;
        line-height: 28px;
        color: var(--ink2);
        margin: 0;
        text-wrap: pretty;
      }
      .homes {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 22px 0 0;
        font-size: 14px;
        line-height: 20px;
        color: var(--ink2);
      }
      .homes .dots {
        display: flex;
      }
      .homes .dot {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        border: 1px solid color-mix(in srgb, var(--c) 68%, var(--paper));
        background: radial-gradient(circle closest-side, var(--c) 0%, color-mix(in srgb, var(--paper) 13%, var(--c)) 60%, color-mix(in srgb, var(--paper) 60%, var(--c)) 90%, var(--paper) 100%);
      }
      .homes .dot.olive { --c: var(--olive); }
      .homes .dot.lav { --c: var(--lavender); margin-left: -8px; }
      .how {
        padding: 0 4px;
        margin-bottom: 16px;
      }
      .steps {
        list-style: none;
        margin: 0;
        padding: 0 4px;
        display: grid;
        gap: 18px;
        counter-reset: step;
      }
      .steps li {
        display: grid;
        grid-template-columns: 28px 1fr;
        column-gap: 14px;
        align-items: start;
        font-size: 17px;
        line-height: 25px;
        color: var(--ink);
      }
      .steps li::before {
        counter-increment: step;
        content: counter(step);
        font-family: var(--serif);
        font-size: 22px;
        line-height: 25px;
        color: var(--ink2);
      }
      .steps li > * {
        grid-column: 2;
        min-width: 0;
      }
      .steps i {
        font-family: var(--serif);
        white-space: nowrap;
      }
      .steps small {
        display: block;
        font-size: 15px;
        line-height: 22px;
        color: var(--ink2);
        margin-top: 2px;
      }
      /* Live: the first step is the button, the one thing she has to do,
         with its number centred on it. */
      .steps li.has-action {
        align-items: center;
      }
      .storeAction {
        display: block;
        text-align: center;
        text-decoration: none;
        font-family: var(--sans);
        font-size: 16px;
        font-weight: 500;
        color: var(--paper);
        background: var(--ink);
        border-radius: 999px;
        padding: 15px 22px;
      }
      /* The old primary, kept for the one person it can still serve. */
      .already {
        font-size: 15px;
        line-height: 22px;
        margin: 28px 0 0;
        padding: 0 4px;
      }
      .already a {
        color: var(--ink2);
        text-underline-offset: 3px;
      }
      /* The invitation's code (2026-11-14): the store does not carry the
         link through an install, so the code is on the page to copy or
         type into Nidi's "Tengo un código". Paper on cream like the card,
         but flat: a thing to read off, letter by letter. */
      .codeBox {
        margin: 32px 0 0;
        padding: 0 4px;
      }
      .codeBox .how { margin-bottom: 10px; padding: 0; }
      .codeRow {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        background: var(--paper);
        border: 1px solid var(--field-line);
        border-radius: 12px;
        padding: 12px 12px 12px 18px;
      }
      .code {
        font-family: var(--sans);
        font-weight: 500;
        font-size: 24px;
        line-height: 30px;
        letter-spacing: 0.14em;
        color: var(--ink);
        user-select: all;
        -webkit-user-select: all;
        white-space: nowrap;
      }
      .copy {
        flex: none;
        font-family: var(--sans);
        font-weight: 500;
        font-size: 15px;
        line-height: 20px;
        color: var(--ink);
        background: transparent;
        border: 1px solid var(--ink);
        border-radius: 999px;
        padding: 9px 16px;
        min-height: 40px;
        cursor: pointer;
      }
      .copy.done {
        color: var(--paper);
        background: var(--ink);
      }
      .codeNote {
        font-size: 15px;
        line-height: 22px;
        color: var(--ink2);
        margin: 10px 0 0;
        text-wrap: pretty;
      }
      @media (max-width: 600px) {
        /* 24 + the 4px inset puts the card and the form on the 28px line
           of the logo and the footer (17/11). */
        main { padding: 24px 24px 32px; }
        .card { padding: 28px 22px 22px; margin-bottom: 34px; }
        .invite h1 { font-size: 34px; line-height: 40px; }
        .lede { font-size: 18px; line-height: 27px; }
      }
      @media (max-width: 360px) {
        .invite h1 { font-size: 30px; line-height: 36px; }
        .steps li { font-size: 16px; }
        .code { font-size: 21px; letter-spacing: 0.1em; }
      }
      .home {
        color: var(--ink);
      }
      /* Step 1: the official App Store and Google Play badges, 48px tall
         (Google's PNG carries transparent padding, cropped by its box). */
      .stores { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
      .store { display: block; line-height: 0; border-radius: 9px; }
      .store img { display: block; height: 48px; width: auto; }
      .store.gp { width: 161px; height: 48px; overflow: hidden; }
      .store.gp img.en { height: 71.4px; margin: -11.7px 0 0 -11.7px; }
      .store.gp img.es { height: 62.5px; margin: -7.3px 0 0 0; }
      /* Entry v6 (17/11): one screen, her email and one button. */
      /* No max-width: a long name ("Alejandrina te invitó a estar cerca
         de Mila y Tomi.") uses the card's width. The site's h1 rule
         balances the lines, as on every page (17/11). */
      .invite h1 {
        font-size: 32px;
        line-height: 38px;
        max-width: none;
        margin: 4px 0 0;
      }
      /* width auto, not 100%: with the 4px inset a full width ran 8px past
         the column on the right (17/11). The inset lines the form up with
         the card's edge. */
      .entryForm { display: block; width: auto; margin: 0 4px; }
      .entryForm label {
        display: block;
        font-family: var(--sans);
        font-weight: 500;
        font-size: 14px;
        line-height: 20px;
        color: var(--ink2);
        margin: 0 0 8px;
      }
      .entryForm input {
        display: block;
        width: 100%;
        box-sizing: border-box;
        font-family: var(--sans);
        font-weight: 400;
        font-size: 18px;
        line-height: 24px;
        color: var(--ink);
        background: var(--paper);
        border: 1px solid var(--field-line);
        border-radius: 12px;
        padding: 14px 16px;
        -webkit-appearance: none;
        appearance: none;
      }
      .entryForm input:focus { outline: 2px solid var(--ink); outline-offset: 1px; }
      .hint, .error, .suggest {
        font-family: var(--sans);
        font-size: 15px;
        line-height: 21px;
        margin: 10px 0 0;
      }
      .hint { color: var(--ink2); font-weight: 400; }
      /* Saved on a computer: said in ink, so it reads as done (17/11). */
      .hint.ok { color: var(--ink); font-weight: 500; }
      .error { color: #a33a2c; font-weight: 500; }
      .suggest { color: var(--ink2); font-weight: 400; }
      .suggest button {
        font: inherit;
        color: var(--ink);
        text-decoration: underline;
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
      }
      .primary {
        display: block;
        width: 100%;
        margin: 22px 0 0;
        font-family: var(--sans);
        font-weight: 500;
        font-size: 17px;
        line-height: 22px;
        color: var(--paper);
        background: var(--ink);
        border: 0;
        border-radius: 999px;
        padding: 15px 20px;
        cursor: pointer;
      }
      .primary[disabled] { opacity: 0.6; cursor: default; }
      .desk, .nocode { margin: 28px 4px 0; }
      .deskLead {
        font-family: var(--sans);
        font-weight: 400;
        font-size: 16px;
        line-height: 23px;
        color: var(--ink);
        margin: 0 0 14px;
      }
      .qr { width: 168px; height: 168px; background: #fff; padding: 10px; margin: 0 0 16px; border: 1px solid var(--field-line); border-radius: 8px; }
      .qr svg { display: block; width: 100%; height: 100%; }
      .nocode .stores { margin: 0 0 12px; }
    </style>
  </head>

  <body>
    <header>
      <!-- The brand logotype, not typed text: the same six paths as
           nidi-app/assets/brand/logo/nidi-wordmark-ink.svg, so the site and

          if (typeof c[key] === "string") nodes[i].textContent = noWidow(c[key]);
        }
        document.getElementById("title").textContent = noWidow(titleText(c));
        document.getElementById("email").placeholder = c.emailPlaceholder;
        var closed = preview && preview.status === "closed";
        var form = document.getElementById("joinForm");
        form.hidden = !linkCode || closed;
        document.getElementById("submit").textContent = savedOnDesk ? c.savedButton : onDesktop ? c.save : c.get;
        if (savedOnDesk) document.getElementById("hint").textContent = noWidow(c.saved);
        document.getElementById("noCode").hidden = !!linkCode;
        if (!linkCode) fillStores(document.getElementById("noCodeStores"), true);
        if (!document.getElementById("desk").hidden) showDesk();
        document.getElementById("privacy").href = c.privacyUrl;
        document.getElementById("terms").href = c.termsUrl;
        document.querySelector(".lang").setAttribute("aria-label", c.nav);
        var buttons = document.querySelectorAll(".lang button");
        for (var j = 0; j < buttons.length; j++) {
          buttons[j].setAttribute("aria-pressed", buttons[j].getAttribute("data-lang") === lang ? "true" : "false");
        }
      }

      function setLang(next) {
        lang = next === "es" ? "es" : "en";
        render();
        try { localStorage.setItem("nidi-lang", lang); } catch (e) {}
      }

      var sending = false;
      function submit(e) {
        e.preventDefault();
        if (sending || !linkCode) return;
        var c = COPY[lang];
        var input = document.getElementById("email");
        var email = (input.value || "").trim().toLowerCase();
        showError(null);
        if (!looksLikeEmail(email)) {
          showError(c.badEmail);
          input.focus();
          return;
        }
        // A likely typo stops once; a second tap goes ahead as typed.
        var suggestEl = document.getElementById("suggest");
        if (suggestEl.hidden && suggestEl.getAttribute("data-shown-for") !== email && showSuggestion(email)) {
          suggestEl.setAttribute("data-shown-for", email);
          return;
        }
        sending = true;
        var button = document.getElementById("submit");
        button.disabled = true;
        button.textContent = c.saving;
        var goOn = function () {
          sending = false;
          button.disabled = false;
          button.textContent = onDesktop ? c.save : c.get;
          if (onDesktop) {
            savedOnDesk = true;
            button.textContent = c.savedButton;
            var hintEl = document.getElementById("hint");
            hintEl.textContent = noWidow(c.saved);
            hintEl.classList.add("ok");
            showDesk();
            return;
          }
          track(onAndroid ? "google_play" : "app_store");
          location.href = storeUrl;
        };
        rpc("save_join_email", { p_code: linkCode, p_email: email, p_platform: platform })
          .then(function (res) {
            var status = res && res.status;
            if (status === "bad_email") { sending = false; button.disabled = false; button.textContent = onDesktop ? c.save : c.get; showError(c.badEmail); return; }
            if (status === "own_email") { sending = false; button.disabled = false; button.textContent = onDesktop ? c.save : c.get; showError(c.ownEmail); return; }
            if (status === "closed") { sending = false; preview = { status: "closed", inviter_first_name: preview && preview.inviter_first_name }; render(); return; }
            goOn();
          })
          // Never stuck on a network error: the store, as before.
          .catch(goOn);
      }

      document.getElementById(isInvite ? "invite" : "missing").hidden = false;

      (function init() {
        var fromUrl = new URLSearchParams(location.search).get("lang");
        if (!fromUrl && /^\/join\/es(\/|$)/i.test(location.pathname)) fromUrl = "es";
        var stored = null;
        try { stored = localStorage.getItem("nidi-lang"); } catch (e) {}
        var browser = (navigator.language || "en").toLowerCase().indexOf("es") === 0 ? "es" : "en";
        setLang(fromUrl || stored || browser);
        document.getElementById("joinForm").addEventListener("submit", submit);
        document.getElementById("email").addEventListener("input", function () {
          showError(null);
          document.getElementById("suggest").hidden = true;
          // A changed email is not the saved one: back to "Guardar mi email".
          if (savedOnDesk) {
            savedOnDesk = false;
            var hintEl = document.getElementById("hint");
            hintEl.classList.remove("ok");
            hintEl.textContent = noWidow(COPY[lang].emailHint);
            document.getElementById("submit").textContent = COPY[lang].save;
          }
        });
        var buttons = document.querySelectorAll(".lang button");
        for (var k = 0; k < buttons.length; k++) {
          buttons[k].addEventListener("click", function (e) { setLang(e.currentTarget.getAttribute("data-lang")); });
        }
        if (linkCode) {
          rpc("get_join_preview", { p_code: linkCode })
            .then(function (res) { preview = res; render(); })
            .catch(function () {});
        }
        if (onDesktop && linkCode) showDesk();
      })();
    </script>
      <!-- ── Arrivals ────────────────────────────────────────────────
         One count, no cookie, no identifier (2026-10-04).

         Maru wanted to know whether anybody reaches nidi.life and was
         handed Google Tag Manager to paste. Every analytics product
         records the URL, and nidi.life/join/<code> is a URL: an invite
         code is a bearer secret that joins a family's nidi for ninety
         days, so shipping them to a vendor as page paths was the one
         thing not to do.

         This sends the route and nothing else, and it does not get to
         decide what is stored: supabase/functions/site-view matches
         whatever arrives against a fixed list and writes '/join/:code'
         for anything under /join/, and public.site_views carries the
         same list as a CHECK constraint. The code never leaves the
         browser. Since flow v4 (2026-10-06) a code opens nothing, but
         old links still carry them, and the rule stays.

         No cookie and no localStorage, which is why the site still
         needs no consent banner, and why this counts visits and can
         never count people. Fired once on load, keepalive so it
         survives the reader leaving immediately, and failures are
         swallowed: nothing here is worth showing anybody. -->
    <script>
      (function () {
        try {
          if (location.hostname.replace(/^www\./, "") !== "nidi.life") return;
          // Maru and Claude are not visitors: open nidi.life/?notrack once on a device and it never counts again there.
          if (location.search.indexOf("notrack") > -1) localStorage.setItem("nidi-notrack", "1");
          if (localStorage.getItem("nidi-notrack")) return;
          var p = location.pathname;
          var body = JSON.stringify({
            // Trimmed here as well as on the server, so a code is not
            // in flight even though the server would drop it. The
            // server's own rule, case and all: /join, /join/ and
            // anything under it (2026-10-06, when bare /join became the
            // share message's link). The old indexOf("/join/") missed
            // /join, and let a /JOIN/<code> go out as typed.
            path: /^\/join(\/|$)/i.test(p) ? "/join/:code" : p,
            referrer: document.referrer || null,
            lang: document.documentElement.lang === "es" ? "es" : "en",
            // The browser's time zone; the function keeps only the country it means (2026-11-09).
            tz: (function () { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || null; } catch (e) { return null; } })(),
          });
          var url =
            "https://orqdnuikcdskmvorchly.supabase.co/functions/v1/site-view";
          // credentials: "omit" is the whole reason this is fetch and
          // not sendBeacon (2026-10-04). Supabase sits behind
          // Cloudflare, which answers with
          // "set-cookie: __cf_bm=...; Domain=supabase.co" — a bot
          // management cookie. sendBeacon sends with credentials
          // included, so every visitor would have picked it up on
          // every page. With credentials omitted the browser ignores
          // Set-Cookie entirely, so "this site stores nothing on your
          // device" stays literally true and the no-banner position
          // holds. keepalive covers the reader who leaves at once,
          // which is the only thing sendBeacon was buying us.
          fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: body,
            credentials: "omit",
            keepalive: true,
            mode: "cors",
          }).catch(function () {});
          // A tap on a store button or on "Already have Nidi? Open it"
          // counts as a click: which one, on this page, nothing else
          // (2026-11-09). Same rules as the visit above.
          // "Copiar" counts too (copy_code, 2026-11-14): the code is never sent.
          // Entry v6: the store opens from the page script after the email
          // is saved, so it reports the tap itself (2026-11-17).
          document.addEventListener("nidi-click", function (e) {
            var t = e.detail === "google_play" || e.detail === "app_store" ? e.detail : null;
            if (!t) return;
            var tz = null;
            try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || null; } catch (e2) {}
            fetch(url, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ click: t, path: /^\/join(\/|$)/i.test(p) ? "/join/:code" : p, lang: document.documentElement.lang === "es" ? "es" : "en", tz: tz }),
              credentials: "omit",
              keepalive: true,
              mode: "cors",
            }).catch(function () {});
          });
          document.addEventListener("click", function (e) {
            var copyTap = e.target && e.target.closest ? e.target.closest("#copyCode") : null;
            var a = e.target && e.target.closest ? e.target.closest("a[href]") : null;
            if (!a && !copyTap) return;
            var h = a ? a.getAttribute("href") || "" : "";
            var t = copyTap ? "copy_code"
              : /^https:\/\/apps\.apple\.com\//.test(h) ? "app_store"
              : /^https:\/\/play\.google\.com\/store\//.test(h) ? "google_play"
              : /^nidi:/.test(h) ? "open_app" : null;
            if (!t) return;
            var tz = null;
            try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || null; } catch (e2) {}
            fetch(url, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ click: t, path: /^\/join(\/|$)/i.test(p) ? "/join/:code" : p, lang: document.documentElement.lang === "es" ? "es" : "en", tz: tz }),
              credentials: "omit",
              keepalive: true,
              mode: "cors",
            }).catch(function () {});
          }, true);
        } catch (e) {}
      })();
    </script>
