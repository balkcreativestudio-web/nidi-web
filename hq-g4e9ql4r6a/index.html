<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Nidi HQ</title>
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#fffdf9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Nidi HQ" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="apple-touch-icon" href="/assets/press/nidi-app-icon-1024.png" />
    <style>
      /* Nidi HQ: Maru's own panel. No analytics, no fonts fetched from
         anywhere, nothing leaves the page but the one call to /hq with
         her token, which lives in this browser only. */
      :root { --paper:#fffdf9; --cream:#f4efe7; --ink:#2a241d; --ink2:#7a6f62; --muted:#b0a596; --line:#e7dfd2;
              --olive:#87995b; --rose:#b5677d; --honey:#d9a441; --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; --serif:Georgia,"Times New Roman",serif; }
      * { box-sizing:border-box; }
      html,body { margin:0; background:var(--cream); color:var(--ink); font-family:var(--sans); font-weight:300; font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased; }
      body { padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px)); }
      main { max-width:960px; margin:0 auto; }
      header { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:8px 0 20px; }
      h1 { font-family:var(--serif); font-weight:400; font-size:28px; margin:0; letter-spacing:-0.02em; }
      .stamp { font-size:12px; color:var(--ink2); letter-spacing:.04em; }
      h2 { font-weight:300; font-size:22px; margin:32px 0 12px; letter-spacing:-0.01em; }
      .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
      .tile { background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:14px 14px 12px; min-width:0; }
      .tile .k { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink2); }
      .tile .v { font-family:var(--serif); font-size:30px; line-height:1.1; margin-top:6px; font-variant-numeric:tabular-nums; }
      .tile .d { font-size:12px; color:var(--ink2); margin-top:4px; }
      .tile.hero { grid-column:span 2; }
      .card { background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:14px; overflow:hidden; }
      table { width:100%; border-collapse:collapse; font-size:14px; }
      th { text-align:left; font-weight:500; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink2); padding:6px 8px; border-bottom:1px solid var(--line); }
      td { padding:8px; border-bottom:1px solid var(--line); vertical-align:top; }
      tr:last-child td { border-bottom:0; }
      .num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
      .tablewrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
      .quiet { color:var(--ink2); font-size:13px; }
      .warn { color:var(--rose); }
      .ok { color:var(--olive); }
      .funnel { display:flex; flex-direction:column; gap:6px; }
      .step { display:grid; grid-template-columns:150px 1fr 48px; gap:10px; align-items:center; font-size:14px; }
      .bar { height:10px; background:var(--line); border-radius:6px; overflow:hidden; }
      .bar i { display:block; height:100%; background:var(--olive); }
      .spark { display:flex; align-items:flex-end; gap:3px; height:48px; margin-top:8px; }
      .spark b { flex:1; background:var(--olive); opacity:.75; border-radius:2px 2px 0 0; min-height:2px; }
      .spark b:last-child { opacity:1; }
      .legend { display:flex; justify-content:space-between; font-size:11px; color:var(--ink2); margin-top:4px; }
      .pill { display:inline-block; font-size:11px; letter-spacing:.04em; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--ink2); white-space:nowrap; }
      .pill.redeemed,.pill.reviewed,.pill.done { border-color:var(--olive); color:var(--olive); }
      .pill.replied,.pill.downloaded { border-color:var(--honey); color:#8a6a1f; }
      .pill.declined,.pill.no_answer { border-color:var(--rose); color:var(--rose); }
      form.row { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
      form.row .full { grid-column:1 / -1; }
      input,select,textarea,button { font:inherit; font-size:15px; color:var(--ink); }
      input,select,textarea { width:100%; padding:10px; border:1px solid var(--line); border-radius:10px; background:#fff; }
      textarea { min-height:60px; resize:vertical; }
      button { padding:10px 16px; border-radius:999px; border:1px solid var(--ink); background:var(--ink); color:var(--paper); cursor:pointer; }
      button.ghost { background:transparent; color:var(--ink); }
      button.link { border:0; background:transparent; color:var(--ink2); padding:4px 6px; font-size:13px; text-decoration:underline; }
      .gate { max-width:420px; margin:18vh auto 0; text-align:center; }
      .gate p { color:var(--ink2); }
      .gate input { text-align:center; letter-spacing:.08em; margin:14px 0; }
      .err { color:var(--rose); font-size:14px; min-height:20px; }
      .links a { color:var(--ink); margin-right:16px; font-size:14px; }
      details summary { cursor:pointer; color:var(--ink2); font-size:14px; }
      footer { margin-top:40px; font-size:12px; color:var(--muted); }
      @media (max-width:520px) { .step { grid-template-columns:110px 1fr 40px; } .tile.hero { grid-column:span 2; } h1 { font-size:24px; } }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script>
      (function () {
        var FN = 'https://orqdnuikcdskmvorchly.supabase.co/functions/v1/hq-g4e9ql4r6a';
        var KEY = 'nidi-hq-token';
        var app = document.getElementById('app');
        var token = null;
        try { token = localStorage.getItem(KEY); } catch (e) {}

        function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
        function fmtDate(iso) { if (!iso) return '—'; var d = new Date(iso); return d.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit' }); }
        function fmtStamp(iso) { var d = new Date(iso); return d.toLocaleString('es-AR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }); }
        function sum(arr, k) { return arr.reduce(function (a, r) { return a + (Number(r[k]) || 0); }, 0); }

        function gate(msg) {
          app.innerHTML = '<div class="gate"><h1>Nidi HQ</h1><p>Tu clave, una vez por dispositivo.</p>'
            + '<input id="tok" type="password" autocomplete="current-password" placeholder="clave" />'
            + '<div class="err" id="err">' + esc(msg || '') + '</div>'
            + '<button id="go">Entrar</button></div>';
          var inp = document.getElementById('tok');
          function go() {
            var v = inp.value.trim();
            if (!v) return;
            token = v;
            try { localStorage.setItem(KEY, v); } catch (e) {}
            load();
          }
          document.getElementById('go').onclick = go;
          inp.onkeydown = function (e) { if (e.key === 'Enter') go(); };
          inp.focus();
        }

        function api(method, body) {
          return fetch(FN, { method: method, headers: { 'x-hq-token': token || '', 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined, credentials: 'omit', cache: 'no-store' })
            .then(function (r) { if (r.status === 401) { throw new Error('unauthorized'); } return r.json(); });
        }

        function load() {
          app.innerHTML = '<p class="quiet">Cargando…</p>';
          api('GET').then(render).catch(function (e) {
            if (e.message === 'unauthorized') { try { localStorage.removeItem(KEY); } catch (x) {} token = null; gate('Clave incorrecta.'); }
            else app.innerHTML = '<p class="warn">No se pudo cargar. Probá de nuevo en un rato.</p><p><button class="ghost" onclick="location.reload()">Reintentar</button></p>';
          });
        }

        function tile(k, v, d, cls) { return '<div class="tile ' + (cls || '') + '"><div class="k">' + esc(k) + '</div><div class="v">' + esc(v) + '</div>' + (d ? '<div class="d">' + d + '</div>' : '') + '</div>'; }

        function spark(series, key) {
          var max = Math.max.apply(null, series.map(function (r) { return Number(r[key]) || 0; }).concat([1]));
          return '<div class="spark">' + series.map(function (r) { var v = Number(r[key]) || 0; return '<b style="height:' + Math.max(4, Math.round(v / max * 100)) + '%" title="' + esc(r.day) + ': ' + v + '"></b>'; }).join('') + '</div>'
            + '<div class="legend"><span>' + fmtDate(series[0].day) + '</span><span>hoy</span></div>';
        }

        function render(d) {
          var s = d.stats, f = s.funnel, m = s.money, w = s.web, ser = s.series || [];
          var today = ser[ser.length - 1] || {}, yest = ser[ser.length - 2] || {};
          var week = ser.slice(-7), prev = ser.slice(-14, -7);
          var dd = function (k) { var a = Number(today[k]) || 0, b = Number(yest[k]) || 0; return 'hoy ' + a + ' · ayer ' + b; };
          var wk = function (k) { var a = sum(week, k), b = sum(prev, k); return '7 días: ' + a + (b ? ' (antes ' + b + ')' : ''); };
          var quietNidis = s.nidis.filter(function (n) { return n.status === 'active' && (n.quiet_days == null || n.quiet_days >= 2); });

          var html = '<header><h1>Nidi HQ</h1><span class="stamp">' + esc(fmtStamp(s.generated_at)) + ' · <button class="link" id="refresh">actualizar</button></span></header>';

          html += '<h2>Hoy</h2><div class="grid">'
            + tile('Familias reales', s.families.outside, 'cuentas fuera de tu círculo desde el lanzamiento', 'hero')
            + tile('Nidis activos', s.nidis.filter(function (n) { return n.status === 'active'; }).length, (quietNidis.length ? '<span class="warn">' + quietNidis.length + ' sin compartir hace 2+ días</span>' : '<span class="ok">todos compartiendo</span>'))
            + tile('Instalaciones', f.installs, dd('installs') + '<br>' + wk('installs'))
            + tile('Cuentas', f.profile, dd('accounts') + '<br>' + wk('accounts'))
            + tile('Momentos', s.moments.total, '24 h: ' + s.moments.last_24h + ' (' + s.moments.outside_last_24h + ' de afuera)<br>' + wk('moments'))
            + tile('Pagas', m.paid_active, '≈ USD ' + m.proceeds_usd_estimate + ' netos')
            + tile('Regalos usados', m.gifts_redeemed + ' / ' + m.gifts_total, 'códigos canjeados')
            + tile('Web', w.total, dd('web') + '<br>' + wk('web'))
            + '</div>';

          html += '<div class="grid" style="margin-top:10px">'
            + '<div class="tile hero"><div class="k">Instalaciones, 14 días</div>' + spark(ser, 'installs') + '</div>'
            + '<div class="tile hero"><div class="k">Momentos, 14 días</div>' + spark(ser, 'moments') + '</div>'
            + '<div class="tile hero"><div class="k">Visitas web, 14 días</div>' + spark(ser, 'web') + '</div>'
            + '</div>';

          html += '<h2>Embudo desde el lanzamiento</h2><div class="card"><div class="funnel">';
          var steps = [['Descargaron y abrieron', f.installs], ['Pusieron el email', f.signed_in], ['Crearon la cuenta', f.profile], ['Armaron un nidi', f.nidi], ['La otra casa entró', f.activated], ['Alguien compartió', f.shared], ['Compartieron los dos', f.both_shared]];
          var top = Math.max(f.installs, 1);
          steps.forEach(function (st) { html += '<div class="step"><span>' + esc(st[0]) + '</span><div class="bar"><i style="width:' + Math.round(st[1] / top * 100) + '%"></i></div><span class="num">' + st[1] + '</span></div>'; });
          html += '</div><p class="quiet" style="margin:10px 0 0">Las descargas de Apple (gente que bajó y no abrió) están en App Store Connect; acá solo cuenta quien abrió la app. ' + esc(s.ratings_note) + '</p></div>';

          html += '<h2>Nidis de afuera</h2><div class="card tablewrap"><table><tr><th>Quiénes</th><th>Estado</th><th class="num">Momentos</th><th>Último</th><th>Cobertura</th></tr>';
          s.nidis.forEach(function (n) {
            var q = n.quiet_days;
            html += '<tr><td>' + esc(n.a) + (n.b ? ' + ' + esc(n.b) : ' <span class="quiet">(esperando)</span>') + '</td><td>' + esc(n.status) + '</td><td class="num">' + n.moments + '</td><td>' + (n.last_moment ? fmtDate(n.last_moment) + (q >= 2 ? ' <span class="warn">' + q + ' días</span>' : '') : '—') + '</td><td>' + (n.covered ? '<span class="ok">sí</span>' : 'prueba') + '</td></tr>';
          });
          html += '</table></div>';

          html += '<h2>Plata</h2><div class="card tablewrap"><table><tr><th>Quién</th><th>Plan</th><th>País</th><th>Desde</th><th>Termina</th></tr>';
          m.paid_list.forEach(function (p) { html += '<tr><td>' + esc(p.who) + '</td><td>' + esc(p.product === 'nidi_monthly' ? 'Mensual' : 'Anual') + '</td><td>' + esc(p.country || '—') + '</td><td>' + fmtDate(p.since) + '</td><td>' + fmtDate(p.ends) + '</td></tr>'; });
          html += '</table><p class="quiet" style="margin:10px 0 0">Neto estimado después del 15% de Apple e impuestos; el número exacto lo paga Apple a principios de enero.</p></div>';

          html += '<h2>Campañas (links de Apple)</h2><div class="card tablewrap"><table><tr><th>ct=</th><th>Dónde</th><th>Desde</th><th class="num">Descargas</th><th></th></tr>';
          d.campaigns.forEach(function (c) { html += '<tr><td><code>' + esc(c.ct) + '</code></td><td>' + esc(c.where_used) + '</td><td>' + fmtDate(c.since) + '</td><td class="num">' + c.downloads + '</td><td><button class="link" data-ct="' + esc(c.ct) + '" data-where="' + esc(c.where_used) + '">editar</button></td></tr>'; });
          html += '</table><p class="quiet" style="margin:10px 0 0">Las descargas se copian de App Store Connect → Analytics → Campaigns (un día de atraso) hasta que conectemos la API.</p>'
            + '<form class="row" id="campform"><input name="ct" placeholder="ct (ej. ig-bio)" required pattern="[a-z0-9_-]{1,40}" /><input name="where_used" placeholder="dónde está publicado" required /><input name="downloads" type="number" min="0" placeholder="descargas (Apple)" /><button type="submit">Guardar campaña</button></form></div>';

          html += '<h2>Contactos</h2><div class="card"><form class="row" id="contactform"><input type="hidden" name="id" /><input name="name" placeholder="nombre o @handle" required maxlength="80" />'
            + '<select name="channel"><option value="whatsapp">WhatsApp</option><option value="instagram">Instagram</option><option value="email">Email</option><option value="facebook">Facebook</option><option value="in_person">En persona</option><option value="other">Otro</option></select>'
            + '<select name="kind"><option value="gift">Código de regalo</option><option value="pitch">Prensa / pitch</option><option value="post">Post en grupo</option><option value="review_ask">Pedido de reseña</option><option value="follow_up">Seguimiento</option><option value="other">Otro</option></select>'
            + '<select name="status"><option value="sent">Enviado</option><option value="replied">Respondió</option><option value="downloaded">Bajó la app</option><option value="redeemed">Canjeó</option><option value="reviewed">Dejó reseña</option><option value="declined">No le interesa</option><option value="no_answer">Sin respuesta</option><option value="done">Listo</option></select>'
            + '<input name="sent_at" type="date" /><textarea class="full" name="note" placeholder="nota (sin emails)" maxlength="500"></textarea>'
            + '<div class="full"><button type="submit" id="contactsave">Guardar contacto</button> <button type="button" class="ghost" id="contactclear">Limpiar</button></div></form>'
            + '<div class="tablewrap" style="margin-top:14px"><table><tr><th>Quién</th><th>Canal</th><th>Qué</th><th>Cuándo</th><th>Estado</th><th>Nota</th><th></th></tr>';
          d.contacts.forEach(function (c) {
            html += '<tr><td>' + esc(c.name) + '</td><td>' + esc(c.channel) + '</td><td>' + esc(c.kind) + '</td><td>' + fmtDate(c.sent_at) + '</td><td><span class="pill ' + esc(c.status) + '">' + esc(c.status) + '</span></td><td class="quiet">' + esc(c.note || '') + '</td><td><button class="link" data-edit=\'' + esc(JSON.stringify(c)) + '\'>editar</button></td></tr>';
          });
          html += '</table></div></div>';

          html += '<h2>Web por origen</h2><div class="grid">';
          Object.keys(w.by_source || {}).forEach(function (k) { html += tile(k === 'ig' ? 'Instagram (bio)' : k, w.by_source[k]); });
          html += '</div>';

          html += '<h2>Links</h2><div class="card links">'
            + '<a href="https://appstoreconnect.apple.com/apps/6774968835/distribution" target="_blank" rel="noopener">App Store Connect</a>'
            + '<a href="https://app.revenuecat.com" target="_blank" rel="noopener">RevenueCat</a>'
            + '<a href="https://supabase.com/dashboard/project/orqdnuikcdskmvorchly" target="_blank" rel="noopener">Supabase</a>'
            + '<a href="https://www.instagram.com/hello.nidi/" target="_blank" rel="noopener">@hello.nidi</a>'
            + '<a href="https://nidi.life/press/" target="_blank" rel="noopener">Kit de prensa</a>'
            + '<a href="https://drive.google.com/drive/folders/1DipIvwK3fUR_YR85jdYm6CTT7WwJ-UdH" target="_blank" rel="noopener">Tandas de Instagram (Drive)</a>'
            + '</div>';

          html += '<footer>Solo vos ves esto. Para salir de este dispositivo: <button class="link" id="logout">borrar la clave</button></footer>';
          app.innerHTML = html;

          document.getElementById('refresh').onclick = load;
          document.getElementById('logout').onclick = function () { try { localStorage.removeItem(KEY); } catch (e) {} token = null; gate(); };

          var cf = document.getElementById('contactform');
          cf.onsubmit = function (e) {
            e.preventDefault();
            var fd = new FormData(cf), body = { action: 'contact_upsert' };
            fd.forEach(function (v, k) { body[k] = v; });
            if (!body.id) delete body.id;
            document.getElementById('contactsave').disabled = true;
            api('POST', body).then(function (r) { if (!r.ok) throw new Error(r.error); load(); }).catch(function (err) { alert('No se guardó: ' + err.message); document.getElementById('contactsave').disabled = false; });
          };
          document.getElementById('contactclear').onclick = function () { cf.reset(); cf.id.value = ''; };
          Array.prototype.forEach.call(document.querySelectorAll('[data-edit]'), function (b) {
            b.onclick = function () {
              var c = JSON.parse(b.getAttribute('data-edit'));
              cf.id.value = c.id; cf.name.value = c.name; cf.channel.value = c.channel; cf.kind.value = c.kind; cf.status.value = c.status; cf.sent_at.value = c.sent_at || ''; cf.note.value = c.note || '';
              cf.scrollIntoView({ behavior: 'smooth', block: 'start' });
            };
          });

          var pf = document.getElementById('campform');
          pf.onsubmit = function (e) {
            e.preventDefault();
            var fd = new FormData(pf), body = { action: 'campaign_upsert', ct: fd.get('ct'), where_used: fd.get('where_used') };
            if (fd.get('downloads') !== '') body.downloads = Number(fd.get('downloads'));
            api('POST', body).then(function (r) { if (!r.ok) throw new Error(r.error); load(); }).catch(function (err) { alert('No se guardó: ' + err.message); });
          };
          Array.prototype.forEach.call(document.querySelectorAll('[data-ct]'), function (b) {
            b.onclick = function () { pf.ct.value = b.getAttribute('data-ct'); pf.where_used.value = b.getAttribute('data-where'); pf.downloads.focus(); pf.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
          });
        }

        if (token) load(); else gate();
      })();
    </script>
  </body>
</html>
