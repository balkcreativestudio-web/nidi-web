<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Nidi HQ</title>
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#f4efe7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Nidi HQ" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="apple-touch-icon" href="/assets/press/nidi-app-icon-1024.png" />
    <style>
      /* Nidi HQ, Maru's own panel. One call to the hq function with her
         token (kept in this browser only); no analytics, no fonts fetched,
         nothing else leaves the page. Lola's rungs (brand-spec p. 26):
         serif for figures and titles, sans light for everything else. */
      @font-face { font-family: "Lora"; src: url(/assets/fonts/Lora-Regular.ttf) format("truetype"); font-weight: 400; font-display: swap; }
      @font-face { font-family: "Lora"; src: url(/assets/fonts/Lora-Italic.ttf) format("truetype"); font-weight: 400; font-style: italic; font-display: swap; }
      @font-face { font-family: "Hanken Grotesk"; src: url(/assets/fonts/HankenGrotesk-Light.ttf) format("truetype"); font-weight: 300; font-display: swap; }
      @font-face { font-family: "Hanken Grotesk"; src: url(/assets/fonts/HankenGrotesk-Medium.ttf) format("truetype"); font-weight: 500; font-display: swap; }
      :root {
        --cream:#f4efe7; --paper:#fffdf9; --ink:#2a241d; --ink2:#7a6f62; --ink3:#b0a596; --line:#e7dfd2; --line2:#efe8dc;
        --olive:#87995b; --olive-soft:#e4e8d5; --rose:#b5677d; --rose-soft:#f1dfe4; --honey:#c9962e; --honey-soft:#f3e7cc; --lagoon:#5f8f9a; --lagoon-soft:#dbe8ea; --sienna:#b0714f;
        --c1:#5f7a2c; --c2:#1c8fb3; --c3:#bd7f06; --c4:#a84470;
        --serif:"Lora",Georgia,serif; --sans:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
      }
      * { box-sizing:border-box; }
      html,body { margin:0; background:var(--cream); color:var(--ink); font-family:var(--sans); font-weight:300; font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased; }
      body { padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(48px + env(safe-area-inset-bottom,0px)); }
      main { max-width:1040px; margin:0 auto; }
      a { color:var(--ink); }
      .num, td.num, .v, .delta, .pct { font-variant-numeric:tabular-nums; }

      /* header */
      header { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin:6px 0 18px; }
      h1 { font-family:var(--serif); font-weight:400; font-size:30px; line-height:1; margin:0; letter-spacing:-0.02em; }
      .sub { font-size:12px; color:var(--ink2); letter-spacing:.04em; margin-top:6px; }
      .range { display:flex; gap:4px; background:var(--paper); border:1px solid var(--line); border-radius:999px; padding:3px; }
      .range button { border:0; background:transparent; color:var(--ink2); font:inherit; font-size:12px; letter-spacing:.04em; padding:6px 10px; border-radius:999px; cursor:pointer; }
      .range button[aria-pressed="true"] { background:var(--ink); color:var(--paper); }

      h2 { font-weight:300; font-size:20px; letter-spacing:-0.01em; margin:30px 0 10px; display:flex; align-items:baseline; gap:10px; }
      h2 small { font-size:12px; color:var(--ink2); letter-spacing:.04em; font-weight:300; }

      /* notifications: what is new, until she closes it */
      .news { background:var(--paper); border:1px solid var(--line); border-radius:14px; margin-bottom:10px; overflow:hidden; }
      .news-head { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line2); font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink2); }
      .news-item { display:grid; grid-template-columns:10px minmax(0,1fr) auto; gap:4px 12px; align-items:start; padding:12px 16px; border-bottom:1px solid var(--line2); }
      .news-item:last-child { border-bottom:0; }
      .news-item > i { width:8px; height:8px; border-radius:50%; margin-top:7px; background:var(--ink3); }
      .news-item.person > i { background:var(--olive); } .news-item.family > i { background:var(--rose); } .news-item.money > i { background:var(--honey); } .news-item.warn > i { background:var(--sienna); } .news-item.push > i { background:var(--lagoon); } .news-item.store > i { background:var(--lagoon); }
      .news-item b { font-weight:500; font-size:15px; display:block; }
      .news-item span { font-size:13px; color:var(--ink2); display:block; margin-top:1px; }
      .news-item button { border:0; background:transparent; color:var(--ink2); width:32px; height:32px; margin:-6px -8px 0 0; border-radius:50%; font-size:16px; line-height:1; cursor:pointer; }
      .news-item button:hover { background:var(--line2); color:var(--ink); }

      /* alerts */
      .alerts { display:flex; flex-direction:column; gap:6px; margin-bottom:6px; }
      .alert { background:var(--paper); border:1px solid var(--line); border-left:3px solid var(--honey); border-radius:10px; padding:10px 12px; font-size:14px; display:flex; gap:10px; align-items:baseline; }
      .alert.quiet { border-left-color:var(--rose); }
      .alert.pending { border-left-color:var(--honey); }
      .alert.redeemed_no_nidi { border-left-color:var(--lagoon); }
      .alert .tag { font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink2); white-space:nowrap; }
      .alert.none { border-left-color:var(--olive); color:var(--ink2); }

      /* kpis */
      .kpis { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
      .kpi svg { color:var(--c1); }
      @media (max-width:640px) { .kpis { grid-template-columns:repeat(2,1fr); } }
      .kpi { background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:14px 14px 10px; min-width:0; display:flex; flex-direction:column; gap:2px; }
      .kpi .k { font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink2); }
      .kpi .v { font-family:var(--serif); font-size:36px; line-height:1.05; margin-top:6px; }
      .kpi .v small { font-size:15px; color:var(--ink2); margin-left:6px; font-family:var(--sans); letter-spacing:.02em; }
      .kpi .meter { height:6px; background:var(--line2); border-radius:3px; overflow:hidden; margin-top:14px; }
      .kpi .meter i { display:block; height:100%; background:var(--olive); border-radius:3px; }
      .kpi .spacer { flex:1; }
      .kpi .d { font-size:12px; color:var(--ink2); min-height:16px; }
      .delta { font-weight:500; }
      .delta.up { color:var(--olive); } .delta.down { color:var(--rose); } .delta.flat { color:var(--ink3); }
      .kpi svg { display:block; width:100%; height:34px; margin-top:8px; overflow:visible; }

      /* cards and charts */
      .card { background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:16px; min-width:0; overflow:hidden; }
      .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
      .three { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
      @media (max-width:760px) { .two,.three { grid-template-columns:1fr; } }
      .chart { width:100%; height:190px; display:block; overflow:visible; }
      .hb { width:100%; height:84px; display:block; overflow:visible; }
      .hb text { font-family:var(--sans); font-size:10px; fill:var(--ink2); }
      .hb .axis { stroke:var(--line); }
      .rm-head { font-family:var(--serif); font-size:21px; line-height:1.35; margin:0 0 12px; max-width:44em; text-wrap:pretty; }
      .rm-head b { font-weight:500; }
      .rm-bar { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; margin-bottom:10px; font-size:13px; color:var(--ink2); }
      .rm-seg { display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; }
      .rm-seg button { border:0; background:transparent; padding:5px 12px; font-size:13px; color:var(--ink2); cursor:pointer; }
      .rm-seg button[aria-pressed="true"] { background:var(--ink); color:var(--paper); }
      .rm-time { display:flex; align-items:center; gap:8px; flex:1 1 220px; min-width:0; }
      .rm-time input { flex:1; min-width:80px; padding:0; border:0; background:transparent; accent-color:var(--rose); }
      .rm-time output { white-space:nowrap; font-variant-numeric:tabular-nums; color:var(--ink); }
      .rm-fam { display:inline-flex; align-items:center; gap:6px; cursor:pointer; white-space:nowrap; }
      .rm-fam input { width:auto; accent-color:var(--ink2); }
      .rm-map { background:#fbf7f0; border:1px solid var(--line2); border-radius:12px; overflow:hidden; }
      .rm-map svg { display:block; width:100%; height:auto; touch-action:manipulation; }
      .rm-map text { font-family:var(--sans); fill:var(--ink); paint-order:stroke; stroke:#fbf7f0; stroke-width:.28em; stroke-linejoin:round; }
      .rm-map .node { cursor:pointer; }
      .rm-legend { display:flex; flex-wrap:wrap; gap:6px 16px; font-size:12px; color:var(--ink2); margin:10px 0 0; }
      .rm-legend i { display:inline-block; width:20px; height:0; border-top:2px solid; margin-right:6px; vertical-align:3px; }
      .rm-legend u { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:-1px; text-decoration:none; }
      .rm-list { margin-top:16px; display:grid; grid-template-columns:1fr 1fr; gap:18px; }
      @media (max-width:760px) { .rm-list { grid-template-columns:1fr; } }
      .rm-list h3 { font-size:11px; font-weight:500; letter-spacing:.09em; text-transform:uppercase; color:var(--ink2); margin:0 0 6px; display:flex; justify-content:space-between; }
      .rm-row { display:grid; grid-template-columns:44px minmax(0,1fr); gap:2px 10px; padding:8px 0; border-top:1px solid var(--line2); font-size:14px; }
      .rm-row .w { font-size:12px; color:var(--ink2); font-variant-numeric:tabular-nums; padding-top:2px; }
      .rm-row .r { font-size:13px; color:var(--ink2); grid-column:2; }
      .rm-row b { font-weight:500; }
      .rm-none { margin-top:14px; padding-top:12px; border-top:1px solid var(--line2); font-size:13px; color:var(--ink2); }
      .chart text { font-family:var(--sans); font-size:10px; fill:var(--ink2); }
      .chart .grid { stroke:var(--line2); stroke-width:1; }
      .chart .axis { stroke:var(--line); }
      .legend { display:flex; flex-wrap:wrap; gap:14px; font-size:12px; color:var(--ink2); margin:0 0 8px; }
      .legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
      .title { font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink2); margin-bottom:8px; display:flex; justify-content:space-between; }
      .foot { font-size:12px; color:var(--ink2); margin-top:10px; }

      /* funnel */
      .funnel { display:flex; flex-direction:column; gap:8px; }
      .step { display:grid; grid-template-columns:180px 1fr 56px 64px; gap:10px; align-items:center; font-size:14px; }
      .step .bar { height:14px; background:var(--line2); border-radius:7px; overflow:hidden; }
      .step .bar i { display:block; height:100%; background:var(--olive); border-radius:7px; }
      .step .pct { font-size:12px; color:var(--ink2); text-align:right; }
      @media (max-width:560px) { .step { grid-template-columns:120px 1fr 40px 52px; font-size:13px; } }
      /* in a narrow card: label, number and percent on one line, the bar under them */
      .three .funnel { gap:12px; }
      .three .step { grid-template-columns:minmax(0,1fr) auto 38px; gap:5px 10px; }
      .three .step > span:first-child { grid-column:1; grid-row:1; }
      .three .step .num { grid-column:2; grid-row:1; text-align:right; }
      .three .step .pct { grid-column:3; grid-row:1; }
      .three .step .bar { grid-column:1 / -1; grid-row:2; height:6px; border-radius:3px; }
      .three .step .bar i { border-radius:3px; }

      /* tables */
      .tablewrap { overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -16px; padding:0 16px; }
      table { width:100%; border-collapse:collapse; font-size:14px; }
      th { text-align:left; font-weight:500; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink2); padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
      td { padding:9px 8px; border-bottom:1px solid var(--line2); vertical-align:top; }
      tr:last-child td { border-bottom:0; }
      td.num, th.num { text-align:right; white-space:nowrap; }
      .quiet { color:var(--ink2); font-size:13px; }
      .warn { color:var(--rose); } .ok { color:var(--olive); } .meh { color:var(--honey); }
      .pill { display:inline-block; font-size:11px; letter-spacing:.04em; padding:2px 9px; border-radius:999px; background:var(--line2); color:var(--ink2); white-space:nowrap; }
      .pill.redeemed,.pill.reviewed,.pill.done,.pill.active { background:var(--olive-soft); color:#4d5c2a; }
      .pill.replied,.pill.downloaded,.pill.pending { background:var(--honey-soft); color:#7a5a16; }
      .pill.declined,.pill.no_answer { background:var(--rose-soft); color:var(--rose); }
      .health { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:1px; }
      .health.g { background:var(--olive); } .health.y { background:var(--honey); } .health.r { background:var(--rose); } .health.n { background:var(--ink3); }
      .bars2 { display:inline-flex; gap:2px; height:8px; width:60px; vertical-align:middle; margin-left:6px; }
      .bars2 i { display:block; height:100%; border-radius:2px; }

      /* pipeline */
      .pipe { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:8px; margin-bottom:12px; }
      .pipe button { border:1px solid var(--line); background:var(--paper); border-radius:12px; padding:10px 8px; text-align:left; font:inherit; color:var(--ink); cursor:pointer; }
      .pipe button[aria-pressed="true"] { border-color:var(--ink); }
      .pipe .n { font-family:var(--serif); font-size:22px; line-height:1; }
      .pipe .l { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink2); margin-top:4px; }

      /* forms */
      form.row { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; margin-top:12px; }
      form.row .full { grid-column:1 / -1; }
      input,select,textarea,button { font:inherit; color:var(--ink); }
      input,select,textarea { width:100%; padding:10px 11px; border:1px solid var(--line); border-radius:10px; background:#fff; font-size:15px; }
      textarea { min-height:60px; resize:vertical; }
      button.primary { padding:10px 16px; border-radius:999px; border:1px solid var(--ink); background:var(--ink); color:var(--paper); cursor:pointer; font-weight:500; }
      button.ghost { padding:10px 16px; border-radius:999px; border:1px solid var(--line); background:transparent; color:var(--ink); cursor:pointer; }
      button.link { border:0; background:transparent; color:var(--ink2); padding:2px 4px; font-size:13px; text-decoration:underline; cursor:pointer; }
      details.add { margin-top:6px; }
      details.add summary { cursor:pointer; color:var(--ink2); font-size:13px; list-style:none; }
      details.add summary::before { content:"+ "; }
      details.add[open] summary::before { content:"− "; }

      /* rooms and controls */
      .controls { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
      .tabs { display:flex; gap:2px; border-bottom:1px solid var(--line); margin:0 0 14px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
      .tabs::-webkit-scrollbar { display:none; }
      .tabs button { border:0; background:transparent; font:inherit; font-size:14px; color:var(--ink2); padding:9px 12px; cursor:pointer; white-space:nowrap; border-bottom:2px solid transparent; margin-bottom:-1px; }
      .tabs button[aria-selected="true"] { color:var(--ink); border-bottom-color:var(--ink); font-weight:500; }
      .q { flex:none; width:18px; height:18px; border:1px solid var(--line); border-radius:50%; background:transparent; color:var(--ink2); font-size:11px; line-height:1; padding:0; cursor:pointer; position:relative; }
      .q::after { content:""; position:absolute; inset:-13px; }
      .q[aria-expanded="true"] { background:var(--ink); color:var(--paper); border-color:var(--ink); }
      .def { margin:0 0 10px; font-size:13px; color:var(--ink2); }
      .kpi .k { display:flex; justify-content:space-between; align-items:center; gap:6px; }
      .kpi .def { margin:6px 0 0; text-transform:none; letter-spacing:0; }
      .title { align-items:center; gap:8px; }
      .title em { font-style:normal; text-transform:none; letter-spacing:0; margin-left:4px; }
      .chart .hit, .hb .hit { fill:transparent; }
      .chart .hit:hover, .hb .hit:hover { fill:rgba(42,36,29,.05); }
      .tip { position:fixed; z-index:20; max-width:280px; background:var(--ink); color:var(--paper); font-size:12px; padding:6px 9px; border-radius:8px; pointer-events:none; }
      details.data { margin-top:8px; }
      details.data summary { cursor:pointer; color:var(--ink2); font-size:12px; }
      .rev { padding:8px 0; border-top:1px solid var(--line2); font-size:13px; }
      .rev b { font-weight:500; }
      table.sticky th:first-child, table.sticky td:first-child { position:sticky; left:-16px; background:var(--paper); min-width:128px; }
      @media (max-width:560px) { header { flex-direction:column; align-items:flex-start; } .controls { justify-content:flex-start; } .kpi .v { font-size:30px; } .tabs button { font-size:13px; padding:9px 7px; } }

      /* marketing: every action, what it cost, what it brought */
      .kpis.four { grid-template-columns:repeat(4,1fr); }
      @media (max-width:760px) { .kpis.four { grid-template-columns:repeat(2,1fr); } }
      .goal-v { font-family:var(--serif); font-size:36px; line-height:1.05; }
      .goal-v small { font-family:var(--sans); font-size:15px; color:var(--ink2); margin-left:6px; letter-spacing:.02em; }
      .goal-bar { position:relative; height:10px; background:var(--line2); border-radius:5px; margin:16px 0 6px; }
      .goal-bar i { position:absolute; left:0; top:0; bottom:0; background:var(--olive); border-radius:5px; }
      .goal-bar b { position:absolute; top:-4px; bottom:-4px; width:2px; margin-left:-1px; background:var(--ink3); border-radius:1px; }
      .goal-ticks { position:relative; height:16px; font-size:11px; color:var(--ink2); }
      .goal-ticks span { position:absolute; transform:translateX(-50%); white-space:nowrap; }
      .goal-ticks span.end { transform:translateX(-100%); }
      .goal-ticks span.hit { color:var(--ink); font-weight:500; }
      .pill.planned { background:var(--honey-soft); color:#7a5a16; }
      .pill.paused { background:var(--rose-soft); color:var(--rose); }
      table.mk td.nm { min-width:240px; }
      table.mk td.when { white-space:nowrap; }
      .mk-top { display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
      .mk-top b { font-weight:500; }
      .mk .meta { font-size:12px; color:var(--ink2); margin-top:2px; }
      .mk .nt { font-size:13px; color:var(--ink2); margin-top:4px; max-width:34em; }
      form.mkf { grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); }
      form.mkf .wide { grid-column:span 2; }
      .f { display:flex; flex-direction:column; gap:4px; min-width:0; }
      .f > span { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink2); }
      @media (max-width:640px) {
        .tablewrap.mkwrap { margin:0; padding:0; overflow:visible; }
        table.mk, table.mk tbody, table.mk tr, table.mk td { display:block; }
        table.mk thead { display:none; }
        table.mk tr { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px 12px; padding:14px 0; border-bottom:1px solid var(--line2); }
        table.mk tr:last-child { border-bottom:0; }
        table.mk td { padding:0; border:0; text-align:left; white-space:normal; }
        table.mk td.nm { grid-column:1 / -1; min-width:0; }
        table.mk td[data-l]::before { content:attr(data-l); display:block; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink2); margin-bottom:1px; }
      }

      /* changes: each one, the same measure before and after */
      .ch-list { display:flex; flex-direction:column; gap:10px; }
      .ch-top { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
      .ch-top b { font-weight:500; font-size:16px; }
      .ch .meta { font-size:12px; color:var(--ink2); margin-top:2px; }
      .ch-metric { font-size:13px; color:var(--ink2); margin:12px 0 6px; }
      .ch-ba { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; border-top:1px solid var(--line2); border-bottom:1px solid var(--line2); padding:10px 0; }
      .ch-ba > div { min-width:0; display:flex; flex-direction:column; gap:1px; }
      .ch-ba .k { font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink2); }
      .ch-ba .v { font-family:var(--serif); font-size:28px; line-height:1.1; }
      .ch-ba .v small { font-family:var(--sans); font-size:13px; color:var(--ink2); margin-left:4px; }
      .ch-ba .quiet { font-size:12px; }
      .ch-say { margin:10px 0 0; font-size:14px; }
      .ch-say b { font-weight:500; }
      .ch .nt { font-size:13px; color:var(--ink2); margin-top:6px; }
      .ch .actions { margin-top:6px; }
      .pill.works { background:var(--olive-soft); color:#4d5c2a; }

              cf.id.value = c.id; cf.shipped_on.value = c.shipped_on || ''; cf.decide_on.value = c.decide_on || ''; cf.verdict.value = c.verdict || ''; cf.note.value = c.note || '';
              document.getElementById('chhint').textContent = c.decide_days ? 'Si "Se decide el" queda vacío: ' + c.decide_days + ' días después de que sale.' : '';
              det.hidden = false; det.open = true; det.querySelector('summary').textContent = 'Editando: ' + c.title; EDITING = true;
              det.scrollIntoView({ behavior: 'smooth', block: 'start' });
            };
          });
        }

        // ── Marketing ───────────────────────────────────────────────────
        // One row per action (hq_marketing), typed here. An empty result is
        // "not known yet" and shows as —, never as 0. The goal (Maru,
        // 2026-11-09): €1k net at least, €3k the target, €5k beyond, by 9/12.
        var GOAL = { from: '2026-11-09', to: '2026-12-09', steps: [[1000, 'mínimo'], [3000, 'óptimo'], [5000, 'excede']] };
        var MK_CH = { apple_ads: 'Apple Ads', ig_boost: 'Boost de Instagram', creators: 'Creadoras', press: 'Prensa', offer: 'Oferta', organic: 'Post orgánico', whatsapp: 'WhatsApp', other: 'Otro' };
        var MK_KIND = { paid: 'Pago', free: 'Gratis', offer: 'Oferta' };
        var MK_ST = { active: 'Activa', planned: 'Planeada', paused: 'Pausada', done: 'Terminada' };
        function eur(n) { n = Math.round((Number(n) || 0) * 100) / 100; return '€' + n.toLocaleString('es-AR', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 }); }
        function known(v) { return v !== null && v !== undefined && v !== ''; }
        function costWord(cost, paid) { return paid ? '<span class="' + (cost <= 4 ? 'ok' : cost <= 8 ? 'meh' : 'warn') + '">' + eur(cost) + '</span>' : eur(cost); }
        function day12(iso) { return dmy(iso + 'T12:00:00'); }

        function tabMkt(d) {
          var rows = d.marketing;
          if (!Array.isArray(rows)) return card('Marketing', '', '<p class="quiet">El registro todavía no está activo: falta aplicar la migración hq_marketing y publicar la función.</p>');
          // active first, and within each state what costs money first
          var order = { active: 0, planned: 1, paused: 2, done: 3 }, korder = { paid: 0, offer: 1, free: 2 };
          rows = rows.slice().sort(function (a, b) { return (order[a.status] - order[b.status]) || (korder[a.kind] - korder[b.kind]) || String(a.starts_on || '9999').localeCompare(String(b.starts_on || '9999')); });
          var spent = sum(rows, 'spent_eur'), budget = sum(rows, 'budget_eur');
          var withNet = rows.filter(function (r) { return known(r.net_eur); }), net = sum(withNet, 'net_eur');
          var paidDl = rows.filter(function (r) { return r.kind === 'paid' && known(r.downloads); }), dlSpent = sum(paidDl, 'spent_eur'), dl = sum(paidDl, 'downloads');
          var paidFam = rows.filter(function (r) { return r.kind === 'paid' && known(r.paying); }), famSpent = sum(paidFam, 'spent_eur'), fam = sum(paidFam, 'paying');
          var html = '<div class="kpis four">'
            + tile('Invertido', 'Lo gastado hasta hoy en todas las acciones. Lo previsto es la suma de los presupuestos.', eur(spent), '', budget ? 'de ' + eur(budget) + ' previstos' : '')
            + tile('Ganado neto', 'Lo que dejaron las familias que pagaron, después de la tienda e impuestos. Se carga a mano en cada acción.', withNet.length ? eur(net) : '—', '', withNet.length ? (spent ? (net / spent).toFixed(1).replace('.', ',') + ' veces lo invertido' : '') : 'sin resultados cargados')
            + tile('Costo por descarga', 'Solo acciones pagas con descargas cargadas: lo gastado dividido por sus descargas. Verde hasta €4, ámbar hasta €8, rojo después.', dl ? costWord(dlSpent / dl, true) : '—', '', dl ? dl + ' ' + plural(dl, 'descarga', 'descargas') + ' de acciones pagas' : paidDl.length && dlSpent ? '<span class="warn">' + eur(dlSpent) + ' sin descargas</span>' : 'sin descargas cargadas')
            + tile('Costo por familia que paga', 'Solo acciones pagas con familias cargadas: lo gastado dividido por las familias que pagan.', fam ? eur(famSpent / fam) : '—', '', fam ? fam + ' ' + plural(fam, 'familia', 'familias') : paidFam.length && famSpent ? '<span class="warn">' + eur(famSpent) + ' sin familias</span>' : 'sin familias cargadas')
            + '</div>';

          // the 30-day goal
          // 30 days: 9/11 is day 1, 8/12 day 30; it ends as 9/12 begins
          var dayMs = 864e5, today = new Date(), end = new Date(GOAL.to + 'T00:00:00'), start = new Date(GOAL.from + 'T00:00:00');
          var dayN = Math.min(30, Math.max(1, Math.floor((today - start) / dayMs) + 1)), left = Math.max(0, Math.ceil((end - today) / dayMs));
          var top = GOAL.steps[GOAL.steps.length - 1][0], next = GOAL.steps.filter(function (g) { return net < g[0]; })[0];
          var bar = '<div class="goal-bar" role="img" aria-label="' + esc(eur(net) + ' de ' + eur(top)) + '"><i style="width:' + Math.min(100, net / top * 100).toFixed(1) + '%"></i>'
            + GOAL.steps.map(function (g) { return '<b style="left:' + (g[0] / top * 100) + '%"></b>'; }).join('') + '</div>'
            + '<div class="goal-ticks">' + GOAL.steps.map(function (g, i) { return '<span class="' + (i === GOAL.steps.length - 1 ? 'end' : '') + (net >= g[0] ? ' hit' : '') + '" style="left:' + (g[0] / top * 100) + '%">€' + (g[0] / 1000) + 'k ' + g[1] + '</span>'; }).join('') + '</div>';
          html += '<div style="margin-top:10px">' + card('Meta de 30 días', 'Suma de los € netos cargados en las acciones. €1k es el mínimo, €3k el óptimo y €5k excede lo esperado.',
            '<div class="goal-v">' + eur(net) + '<small>' + (next ? 'de ' + eur(next[0]) + ' (' + next[1] + ')' : 'pasaste los €5k') + '</small></div><div class="d quiet">' + (left ? 'Día ' + dayN + ' de 30 · ' + (left === 1 ? 'falta 1 día' : 'faltan ' + left + ' días') : 'Terminó el 9/12') + '</div>' + bar,
            'hasta el 9/12') + '</div>';

          // the actions
          var num = function (v) { return known(v) ? Number(v).toLocaleString('es-AR') : '<span class="quiet">—</span>'; };
          html += '<h2>Acciones <small>' + rows.length + '</small></h2><div class="card"><div class="tablewrap mkwrap"><table class="mk"><thead><tr><th>Acción</th><th>Cuándo</th><th>Estado</th><th class="num">Gastado</th><th class="num">Descargas</th><th class="num">Cuentas</th><th class="num">Nidis</th><th class="num">Pagan</th><th class="num">Neto</th><th class="num">€/descarga</th></tr></thead><tbody>';
          if (!rows.length) html += '<tr><td colspan="10" class="quiet">Todavía ninguna.</td></tr>';
          rows.forEach(function (r) {
            var when = r.starts_on ? day12(r.starts_on) + ' → ' + (r.ends_on ? day12(r.ends_on) : '') : r.ends_on ? 'hasta ' + day12(r.ends_on) : '<span class="quiet">sin fecha</span>';
            var cpd = Number(r.spent_eur) > 0 && known(r.downloads) ? (Number(r.downloads) ? costWord(r.spent_eur / r.downloads, r.kind === 'paid') : '<span class="warn">sin descargas</span>') : '<span class="quiet">—</span>';
            html += '<tr><td class="nm"><div class="mk-top"><b>' + esc(r.name) + '</b><button class="link" data-mk=\'' + esc(JSON.stringify(r)) + '\'>editar</button></div>'
              + '<div class="meta">' + esc(MK_CH[r.channel] || r.channel) + (MK_KIND[r.kind] !== MK_CH[r.channel] ? ' · ' + esc(MK_KIND[r.kind] || r.kind) : '') + (r.ct ? ' · <code>ct=' + esc(r.ct) + '</code>' : '') + '</div>'
              + (r.note ? '<div class="nt">' + esc(r.note) + '</div>' : '') + '</td>'
              + '<td class="when" data-l="Cuándo">' + when + '</td>'
              + '<td data-l="Estado"><span class="pill ' + esc(r.status) + '">' + esc(MK_ST[r.status] || r.status) + '</span></td>'
              + '<td class="num" data-l="Gastado">' + eur(r.spent_eur) + (Number(r.budget_eur) > 0 ? '<span class="quiet"> de ' + eur(r.budget_eur) + '</span>' : '') + '</td>'
              + '<td class="num" data-l="Descargas">' + num(r.downloads) + '</td>'
              + '<td class="num" data-l="Cuentas">' + num(r.accounts) + '</td>'
              + '<td class="num" data-l="Nidis">' + num(r.nidis) + '</td>'
              + '<td class="num" data-l="Pagan">' + num(r.paying) + '</td>'
              + '<td class="num" data-l="Neto">' + (known(r.net_eur) ? eur(r.net_eur) : '<span class="quiet">—</span>') + '</td>'
              + '<td class="num" data-l="€/descarga">' + cpd + '</td></tr>';
          });
          html += '</tbody></table></div>';

          var opts = function (map) { return Object.keys(map).map(function (k) { return '<option value="' + k + '">' + esc(map[k]) + '</option>'; }).join(''); };
          var f = function (label, input, cls) { return '<label class="f' + (cls ? ' ' + cls : '') + '"><span>' + label + '</span>' + input + '</label>'; };
          var money = function (name) { return '<input name="' + name + '" type="text" inputmode="decimal" pattern="[0-9]+([.,][0-9]{1,2})?" autocomplete="off" />'; };
          var count = function (name) { return '<input name="' + name + '" type="number" min="0" step="1" inputmode="numeric" />'; };
          html += '<details class="add" id="mkdetails" style="margin-top:12px"><summary>Agregar acción</summary><form class="row mkf" id="mkform"><input type="hidden" name="id" />'
            + f('Nombre', '<input name="name" required maxlength="80" />', 'wide')
            + f('Canal', '<select name="channel">' + opts(MK_CH) + '</select>')
            + f('Tipo', '<select name="kind">' + opts(MK_KIND) + '</select>')
            + f('Estado', '<select name="status"><option value="planned">Planeada</option><option value="active">Activa</option><option value="paused">Pausada</option><option value="done">Terminada</option></select>')
            + f('Empieza', '<input name="starts_on" type="date" />')
            + f('Termina', '<input name="ends_on" type="date" />')
            + f('Presupuesto €', money('budget_eur'))
            + f('Gastado €', money('spent_eur'))
            + f('Descargas', count('downloads'))
            + f('Cuentas nuevas', count('accounts'))
            + f('Nidis creados', count('nidis'))
            + f('Familias que pagan', count('paying'))
            + f('Neto ganado €', money('net_eur'))
            + f('Link ct', '<input name="ct" placeholder="ej. ig-boost" pattern="[a-z0-9_\\-]{1,40}\\*?" maxlength="41" autocomplete="off" />')
            + f('Notas', '<textarea name="note" maxlength="500" placeholder="sin emails"></textarea>', 'full')
            + '<p class="quiet full" style="margin:0">Vacío es "todavía no se sabe"; 0 es cero.</p>'
            + '<div class="full"><button class="primary" type="submit" id="mksave">Guardar</button> <button type="button" class="ghost" id="mkclear">Limpiar</button> <button type="button" class="link" id="mkdelete" hidden>Borrar esta acción</button></div></form></details></div>';
          return html;
        }

        function wireMk() {
          var mf = document.getElementById('mkform'), det = document.getElementById('mkdetails'), del = document.getElementById('mkdelete');
          if (!mf) return;
          var MONEY = ['budget_eur', 'spent_eur', 'net_eur'], COUNTS = ['downloads', 'accounts', 'nidis', 'paying'];
          var reset = function () { mf.reset(); mf.id.value = ''; del.hidden = true; det.querySelector('summary').textContent = 'Agregar acción'; EDITING = false; };
          mf.onsubmit = function (e) {
            e.preventDefault();
            var fd = new FormData(mf), body = { action: 'marketing_upsert' }, bad = false;
            ['name', 'channel', 'kind', 'status', 'starts_on', 'ends_on', 'ct', 'note'].forEach(function (k) { body[k] = String(fd.get(k) || '').trim(); });
            MONEY.forEach(function (k) { var v = String(fd.get(k) || '').trim().replace(',', '.'); body[k] = v === '' ? null : Number(v); if (v !== '' && !isFinite(body[k])) bad = true; });
            COUNTS.forEach(function (k) { var v = String(fd.get(k) || '').trim(); body[k] = v === '' ? null : Number(v); });
            if (bad) { alert('Revisá los montos: solo números, con coma para los centavos.'); return; }
            if (body.starts_on && body.ends_on && body.ends_on < body.starts_on) { alert('Termina antes de empezar.'); return; }
            if (fd.get('id')) body.id = fd.get('id');
            document.getElementById('mksave').disabled = true;
            api('POST', body).then(function (r) { if (!r.ok) throw new Error(r.error); load(); }).catch(function (err) { alert(err.message === 'bad_marketing' ? 'No se guardó: revisá los campos. Las notas no pueden llevar emails.' : 'No se guardó: ' + err.message); document.getElementById('mksave').disabled = false; });
          };
          document.getElementById('mkclear').onclick = reset;
          del.onclick = function () {
            if (!mf.id.value || !confirm('¿Borrar esta acción del registro?')) return;
            api('POST', { action: 'marketing_delete', id: mf.id.value }).then(function (r) { if (!r.ok) throw new Error(r.error); load(); }).catch(function (err) { alert('No se borró: ' + err.message); });
          };
          Array.prototype.forEach.call(document.querySelectorAll('[data-mk]'), function (b) {
            b.onclick = function () {
              var r = JSON.parse(b.getAttribute('data-mk'));
              reset();
              mf.id.value = r.id; mf.name.value = r.name; mf.channel.value = r.channel; mf.kind.value = r.kind; mf.status.value = r.status;
              mf.starts_on.value = r.starts_on || ''; mf.ends_on.value = r.ends_on || ''; mf.ct.value = r.ct || ''; mf.note.value = r.note || '';
              MONEY.forEach(function (k) { mf[k].value = known(r[k]) ? String(Number(r[k])).replace('.', ',') : ''; });
              COUNTS.forEach(function (k) { mf[k].value = known(r[k]) ? r[k] : ''; });
              del.hidden = false; det.open = true; det.querySelector('summary').textContent = 'Editando: ' + r.name; EDITING = true;
              det.scrollIntoView({ behavior: 'smooth', block: 'start' });
            };
          });
        }

        function wire() {
          document.getElementById('refresh').onclick = load;
          document.getElementById('logout').onclick = function () { try { localStorage.removeItem(KEY); } catch (e) {} token = null; DATA = null; gate(); };
          Array.prototype.forEach.call(document.querySelectorAll('[data-range]'), function (b) { b.onclick = function () { range = Number(b.getAttribute('data-range')); try { localStorage.setItem(RANGE_KEY, String(range)); } catch (e) {} render(); }; });
          Array.prototype.forEach.call(document.querySelectorAll('[data-filter]'), function (b) { b.onclick = function () { CONTACT_FILTER = b.getAttribute('data-filter'); render(); }; });

          Array.prototype.forEach.call(document.querySelectorAll('[data-view]'), function (b) { b.onclick = function () { VIEW = b.getAttribute('data-view'); try { localStorage.setItem('nidi-hq-view', VIEW); } catch (e) {} render(); }; });
          Array.prototype.forEach.call(document.querySelectorAll('[data-tab]'), function (b) { b.onclick = function () { TAB = b.getAttribute('data-tab'); try { localStorage.setItem('nidi-hq-tab', TAB); } catch (e) {} render(); window.scrollTo(0, 0); }; });
          Array.prototype.forEach.call(document.querySelectorAll('.q'), function (b) { b.onclick = function (e) { e.stopPropagation(); var box = b.closest('.card,.kpi'), def = box && box.querySelector('.def'); if (!def) return; def.hidden = !def.hidden; b.setAttribute('aria-expanded', String(!def.hidden)); }; });

          var cf = document.getElementById('contactform'), cdet = document.getElementById('contactdetails'), del = document.getElementById('contactdelete');
          if (!cf) return; // the forms live in Adquisición
          cf.onsubmit = function (e) {
            e.preventDefault();
            var fd = new FormData(cf), body = { action: 'contact_upsert' };
            fd.forEach(function (v, k) { body[k] = v; });
            if (!body.id) delete body.id;
            document.getElementById('contactsave').disabled = true;
            api('POST', body).then(function (r) { if (!r.ok) throw new Error(r.error); load(); }).catch(function (err) { alert('No se guardó: ' + err.message); document.getElementById('contactsave').disabled = false; });
          };
          document.getElementById('contactclear').onclick = function () { cf.reset(); cf.id.value = ''; del.hidden = true; cdet.querySelector('summary').textContent = 'Agregar contacto'; EDITING = false; };
          del.onclick = function () {
            if (!cf.id.value || !confirm('¿Borrar este contacto?')) return;
            api('POST', { action: 'contact_delete', id: cf.id.value }).then(function (r) { if (!r.ok) throw new Error(r.error); load(); }).catch(function (err) { alert('No se borró: ' + err.message); });
          };
          Array.prototype.forEach.call(document.querySelectorAll('[data-edit]'), function (b) {
            b.onclick = function () {
              var c = JSON.parse(b.getAttribute('data-edit'));
              cf.id.value = c.id; cf.name.value = c.name; cf.channel.value = c.channel; cf.kind.value = c.kind; cf.status.value = c.status; cf.sent_at.value = c.sent_at || ''; cf.place_city.value = c.place_city || ''; cf.place_country.value = c.place_country || ''; cf.note.value = c.note || '';
              del.hidden = false; cdet.open = true; cdet.querySelector('summary').textContent = 'Editando: ' + c.name; EDITING = true;
              cdet.scrollIntoView({ behavior: 'smooth', block: 'start' });
              cf.status.focus();
            };
          });

          var pf = document.getElementById('campform'), pdet = document.getElementById('campdetails');
          pf.onsubmit = function (e) {
            e.preventDefault();
            var fd = new FormData(pf), body = { action: 'campaign_upsert', ct: fd.get('ct'), where_used: fd.get('where_used'), name: fd.get('name'), channel: fd.get('channel'), kind: fd.get('kind'), place_city: fd.get('place_city'), place_country: fd.get('place_country'), note: fd.get('note') };
            if (fd.get('downloads') !== '') body.downloads = Number(fd.get('downloads'));
            if (fd.get('audience') !== '') body.audience = Number(fd.get('audience'));
            if (fd.get('since')) body.since = fd.get('since');
            api('POST', body).then(function (r) { if (!r.ok) throw new Error(r.error); load(); }).catch(function (err) { alert('No se guardó: ' + err.message); });
          };
          Array.prototype.forEach.call(document.querySelectorAll('[data-camp]'), function (b) {
            b.onclick = function () {
              var c = JSON.parse(b.getAttribute('data-camp'));
              pf.name.value = c.name; pf.ct.value = c.ct; pf.channel.value = c.channel; pf.kind.value = c.kind || 'link'; pf.where_used.value = c.where_used; pf.place_city.value = c.place_city || ''; pf.place_country.value = c.place_country || ''; pf.since.value = c.since || ''; pf.audience.value = c.audience == null ? '' : c.audience; pf.downloads.value = c.downloads; pf.note.value = c.note || '';
              pdet.open = true; EDITING = true; pdet.scrollIntoView({ behavior: 'smooth', block: 'start' }); pf.downloads.focus();
            };
          });
        }

        // the hover layer: one tooltip, for whatever carries data-tip
        var tip = document.createElement('div'); tip.className = 'tip'; tip.hidden = true; document.body.appendChild(tip);
        function showTip(e) {
          var t = e.target && e.target.closest ? e.target.closest('[data-tip]') : null;
          if (!t) { tip.hidden = true; return; }
          tip.textContent = t.getAttribute('data-tip'); tip.hidden = false;
          var p = e.touches ? e.touches[0] : e, w = tip.offsetWidth, x = Math.min(window.innerWidth - w - 8, Math.max(8, p.clientX - w / 2)), y = p.clientY - tip.offsetHeight - 12;
          tip.style.left = x + 'px'; tip.style.top = Math.max(8, y) + 'px';
        }
        app.addEventListener('mousemove', showTip);
        app.addEventListener('mouseleave', function () { tip.hidden = true; });
        app.addEventListener('touchstart', showTip, { passive: true });
        window.addEventListener('scroll', function () { tip.hidden = true; }, { passive: true });

        if (token) load(); else gate();
        var markEditing = function (e) { if (e.target && e.target.closest && e.target.closest('form')) EDITING = true; };
        app.addEventListener('input', markEditing);
        app.addEventListener('change', markEditing);
        document.addEventListener('visibilitychange', function () { if (!document.hidden && token && DATA && !EDITING) load(); });
      })();
    </script>
  </body>
</html>
