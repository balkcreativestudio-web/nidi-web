<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Nidi HQ</title>
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#f4efe7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Nidi HQ" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="apple-touch-icon" href="/assets/press/nidi-app-icon-1024.png" />
    <style>
      /* Nidi HQ, Maru's own panel. One call to the hq function with her
         token (kept in this browser only); no analytics, no fonts fetched,
         nothing else leaves the page. Lola's rungs (brand-spec p. 26):
         serif for figures and titles, sans light for everything else. */
      @font-face { font-family: "Lora"; src: url(/assets/fonts/Lora-Regular.ttf) format("truetype"); font-weight: 400; font-display: swap; }
      @font-face { font-family: "Lora"; src: url(/assets/fonts/Lora-Italic.ttf) format("truetype"); font-weight: 400; font-style: italic; font-display: swap; }
      @font-face { font-family: "Hanken Grotesk"; src: url(/assets/fonts/HankenGrotesk-Light.ttf) format("truetype"); font-weight: 300; font-display: swap; }
      @font-face { font-family: "Hanken Grotesk"; src: url(/assets/fonts/HankenGrotesk-Medium.ttf) format("truetype"); font-weight: 500; font-display: swap; }
      :root {
        --cream:#f4efe7; --paper:#fffdf9; --ink:#2a241d; --ink2:#7a6f62; --ink3:#b0a596; --line:#e7dfd2; --line2:#efe8dc;
        --olive:#87995b; --olive-soft:#e4e8d5; --rose:#b5677d; --rose-soft:#f1dfe4; --honey:#c9962e; --honey-soft:#f3e7cc; --lagoon:#5f8f9a; --lagoon-soft:#dbe8ea; --sienna:#b0714f;
        --serif:"Lora",Georgia,serif; --sans:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
      }
      * { box-sizing:border-box; }
      html,body { margin:0; background:var(--cream); color:var(--ink); font-family:var(--sans); font-weight:300; font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased; }
      body { padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(48px + env(safe-area-inset-bottom,0px)); }
      main { max-width:1040px; margin:0 auto; }
      a { color:var(--ink); }
      .num, td.num, .v, .delta, .pct { font-variant-numeric:tabular-nums; }

      /* header */
      header { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin:6px 0 18px; }
      h1 { font-family:var(--serif); font-weight:400; font-size:30px; line-height:1; margin:0; letter-spacing:-0.02em; }
      .sub { font-size:12px; color:var(--ink2); letter-spacing:.04em; margin-top:6px; }
      .range { display:flex; gap:4px; background:var(--paper); border:1px solid var(--line); border-radius:999px; padding:3px; }
      .range button { border:0; background:transparent; color:var(--ink2); font:inherit; font-size:12px; letter-spacing:.04em; padding:6px 10px; border-radius:999px; cursor:pointer; }
      .range button[aria-pressed="true"] { background:var(--ink); color:var(--paper); }

      h2 { font-weight:300; font-size:20px; letter-spacing:-0.01em; margin:30px 0 10px; display:flex; align-items:baseline; gap:10px; }
      h2 small { font-size:12px; color:var(--ink2); letter-spacing:.04em; font-weight:300; }

      /* alerts */
      .alerts { display:flex; flex-direction:column; gap:6px; margin-bottom:6px; }
      .alert { background:var(--paper); border:1px solid var(--line); border-left:3px solid var(--honey); border-radius:10px; padding:10px 12px; font-size:14px; display:flex; gap:10px; align-items:baseline; }
      .alert.quiet { border-left-color:var(--rose); }
      .alert.pending { border-left-color:var(--honey); }
      .alert.redeemed_no_nidi { border-left-color:var(--lagoon); }
      .alert .tag { font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink2); white-space:nowrap; }
      .alert.none { border-left-color:var(--olive); color:var(--ink2); }

      /* kpis */
      .kpis { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
      @media (max-width:640px) { .kpis { grid-template-columns:repeat(2,1fr); } }
      .kpi { background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:14px 14px 10px; min-width:0; display:flex; flex-direction:column; gap:2px; }
      .kpi .k { font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink2); }
      .kpi .v { font-family:var(--serif); font-size:36px; line-height:1.05; margin-top:6px; }
      .kpi .v small { font-size:15px; color:var(--ink2); margin-left:4px; font-family:var(--sans); }
      .kpi .d { font-size:12px; color:var(--ink2); min-height:16px; }
      .delta { font-weight:500; }
      .delta.up { color:var(--olive); } .delta.down { color:var(--rose); } .delta.flat { color:var(--ink3); }
      .kpi svg { display:block; width:100%; height:34px; margin-top:8px; overflow:visible; }

      /* cards and charts */
      .card { background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:16px; min-width:0; overflow:hidden; }
      .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
      .three { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
      @media (max-width:760px) { .two,.three { grid-template-columns:1fr; } }
      .chart { width:100%; height:190px; display:block; overflow:visible; }
      .chart text { font-family:var(--sans); font-size:10px; fill:var(--ink2); }
      .chart .grid { stroke:var(--line2); stroke-width:1; }
      .chart .axis { stroke:var(--line); }
      .legend { display:flex; flex-wrap:wrap; gap:14px; font-size:12px; color:var(--ink2); margin:0 0 8px; }
      .legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
      .title { font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink2); margin-bottom:8px; display:flex; justify-content:space-between; }
      .foot { font-size:12px; color:var(--ink2); margin-top:10px; }

      /* funnel */
      .funnel { display:flex; flex-direction:column; gap:8px; }
      .step { display:grid; grid-template-columns:180px 1fr 56px 64px; gap:10px; align-items:center; font-size:14px; }
      .step .bar { height:14px; background:var(--line2); border-radius:7px; overflow:hidden; }
      .step .bar i { display:block; height:100%; background:var(--olive); border-radius:7px; }
      .step .pct { font-size:12px; color:var(--ink2); text-align:right; }
      @media (max-width:560px) { .step { grid-template-columns:120px 1fr 40px 52px; font-size:13px; } }

      /* tables */
      .tablewrap { overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -16px; padding:0 16px; }
      table { width:100%; border-collapse:collapse; font-size:14px; }
      th { text-align:left; font-weight:500; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink2); padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
      td { padding:9px 8px; border-bottom:1px solid var(--line2); vertical-align:top; }
      tr:last-child td { border-bottom:0; }
      td.num, th.num { text-align:right; white-space:nowrap; }
      .quiet { color:var(--ink2); font-size:13px; }
      .warn { color:var(--rose); } .ok { color:var(--olive); } .meh { color:var(--honey); }
      .pill { display:inline-block; font-size:11px; letter-spacing:.04em; padding:2px 9px; border-radius:999px; background:var(--line2); color:var(--ink2); white-space:nowrap; }
      .pill.redeemed,.pill.reviewed,.pill.done,.pill.active { background:var(--olive-soft); color:#4d5c2a; }
      .pill.replied,.pill.downloaded,.pill.pending { background:var(--honey-soft); color:#7a5a16; }
      .pill.declined,.pill.no_answer { background:var(--rose-soft); color:var(--rose); }
      .health { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:1px; }
      .health.g { background:var(--olive); } .health.y { background:var(--honey); } .health.r { background:var(--rose); } .health.n { background:var(--ink3); }
      .bars2 { display:inline-flex; gap:2px; height:8px; width:60px; vertical-align:middle; margin-left:6px; }
      .bars2 i { display:block; height:100%; border-radius:2px; }

      /* pipeline */
      .pipe { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:8px; margin-bottom:12px; }
      .pipe button { border:1px solid var(--line); background:var(--paper); border-radius:12px; padding:10px 8px; text-align:left; font:inherit; color:var(--ink); cursor:pointer; }
      .pipe button[aria-pressed="true"] { border-color:var(--ink); }
      .pipe .n { font-family:var(--serif); font-size:22px; line-height:1; }
      .pipe .l { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink2); margin-top:4px; }

      /* forms */
      form.row { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; margin-top:12px; }
      form.row .full { grid-column:1 / -1; }
      input,select,textarea,button { font:inherit; color:var(--ink); }
      input,select,textarea { width:100%; padding:10px 11px; border:1px solid var(--line); border-radius:10px; background:#fff; font-size:15px; }
      textarea { min-height:60px; resize:vertical; }
      button.primary { padding:10px 16px; border-radius:999px; border:1px solid var(--ink); background:var(--ink); color:var(--paper); cursor:pointer; font-weight:500; }
      button.ghost { padding:10px 16px; border-radius:999px; border:1px solid var(--line); background:transparent; color:var(--ink); cursor:pointer; }
      button.link { border:0; background:transparent; color:var(--ink2); padding:2px 4px; font-size:13px; text-decoration:underline; cursor:pointer; }
      details.add { margin-top:6px; }
      details.add summary { cursor:pointer; color:var(--ink2); font-size:13px; list-style:none; }
      details.add summary::before { content:"+ "; }
      details.add[open] summary::before { content:"− "; }

      /* gate */
      .gate { max-width:400px; margin:18vh auto 0; text-align:center; }
      .gate h1 { font-size:34px; }
      .gate p { color:var(--ink2); }
      .gate input { text-align:center; letter-spacing:.08em; margin:14px 0; }
      .err { color:var(--rose); font-size:14px; min-height:20px; }
      .links { display:flex; flex-wrap:wrap; gap:8px; }
      .links a { text-decoration:none; border:1px solid var(--line); background:var(--paper); border-radius:999px; padding:8px 14px; font-size:13px; }
      footer { margin-top:44px; font-size:12px; color:var(--ink3); display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; }
      .skeleton { color:var(--ink2); padding:40px 0; text-align:center; }
    </style>
  </head>
  <body>
    <main id="app"><p class="skeleton">Cargando…</p></main>
    <script>
      (function () {
        var FN = 'https://orqdnuikcdskmvorchly.supabase.co/functions/v1/hq-g4e9ql4r6a';
        var KEY = 'nidi-hq-token', RANGE_KEY = 'nidi-hq-range';
        var app = document.getElementById('app');
        var token = null, range = 14, DATA = null;
        try { token = localStorage.getItem(KEY); range = Number(localStorage.getItem(RANGE_KEY)) || 14; } catch (e) {}

        // ── helpers ─────────────────────────────────────────────────────
        function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
        function dmy(iso) { if (!iso) return '—'; return new Date(iso).toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit' }); }
        function dmyLong(iso) { if (!iso) return '—'; return new Date(iso).toLocaleDateString('es-AR', { day: 'numeric', month: 'short', year: 'numeric' }); }
        function stamp(iso) { return new Date(iso).toLocaleString('es-AR', { weekday: 'short', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }); }
        function sum(arr, k) { return arr.reduce(function (a, r) { return a + (Number(r[k]) || 0); }, 0); }
        function pct(a, b) { return b ? Math.round(a / b * 100) : 0; }
        function delta(now, before, unit) {
          if (!before && !now) return '<span class="delta flat">sin cambios</span>';
          if (!before) return '<span class="delta up">+' + now + ' ' + (unit || '') + '</span>';
          var d = now - before, p = Math.round(d / before * 100);
          var cls = d > 0 ? 'up' : d < 0 ? 'down' : 'flat';
          return '<span class="delta ' + cls + '">' + (d > 0 ? '+' : '') + d + ' (' + (p > 0 ? '+' : '') + p + '%)</span>';
        }
        function plural(n, s, p) { return n === 1 ? s : p; }

        // sparkline: a tiny area, last point marked
        function spark(series, key, color) {
          var vals = series.map(function (r) { return Number(r[key]) || 0; });
          var max = Math.max.apply(null, vals.concat([1])), w = 100, h = 34, n = vals.length;
          var pts = vals.map(function (v, i) { return [(i / Math.max(1, n - 1)) * w, h - 2 - (v / max) * (h - 6)]; });
          var line = pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
          var area = line + ' L' + w + ' ' + h + ' L0 ' + h + ' Z';
          var last = pts[pts.length - 1];
          return '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" aria-hidden="true"><path d="' + area + '" fill="' + color + '" opacity=".14"/><path d="' + line + '" fill="none" stroke="' + color + '" stroke-width="1.5" vector-effect="non-scaling-stroke"/><circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="2.4" fill="' + color + '" vector-effect="non-scaling-stroke"/></svg>';
        }

        // bar/line chart with gridlines, y labels and date ticks. keys: [{k, color, label, line?}]
        function chart(series, keys, opts) {
          opts = opts || {};
          var W = 600, H = 190, L = 28, R = 6, T = 10, B = 24, iw = W - L - R, ih = H - T - B, n = series.length;
          var max = 1;
          series.forEach(function (r) { var stack = 0; keys.forEach(function (k) { var v = Number(r[k.k]) || 0; if (opts.stacked && !k.line) stack += v; else max = Math.max(max, v); }); max = Math.max(max, stack); });
          var step = max <= 5 ? 1 : max <= 10 ? 2 : max <= 25 ? 5 : max <= 50 ? 10 : max <= 100 ? 20 : Math.ceil(max / 5 / 10) * 10;
          var top = Math.ceil(max / step) * step;
          var y = function (v) { return T + ih - (v / top) * ih; };
          var x = function (i) { return L + (i + 0.5) * (iw / n); };
          var out = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(opts.label || '') + '">';
          for (var g = 0; g <= top; g += step) out += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(g) + '" y2="' + y(g) + '"/><text x="' + (L - 6) + '" y="' + (y(g) + 3) + '" text-anchor="end">' + g + '</text>';
          var bw = Math.max(2, (iw / n) * 0.62);
          series.forEach(function (r, i) {
            var base = 0;
            keys.forEach(function (k) {
              if (k.line) return;
              var v = Number(r[k.k]) || 0; if (!v) return;
              var y1 = y(base + v), y0 = y(base);
              out += '<rect x="' + (x(i) - bw / 2) + '" y="' + y1 + '" width="' + bw + '" height="' + Math.max(0, y0 - y1) + '" fill="' + k.color + '" rx="2"><title>' + esc(r.day) + ' · ' + esc(k.label) + ': ' + v + '</title></rect>';
              if (opts.stacked) base += v;
            });
          });
          keys.forEach(function (k) {
            if (!k.line) return;
            var d = series.map(function (r, i) { return (i ? 'L' : 'M') + x(i) + ' ' + y(Number(r[k.k]) || 0); }).join(' ');
            out += '<path d="' + d + '" fill="none" stroke="' + k.color + '" stroke-width="2" stroke-linejoin="round"/>';
          });
          var every = n > 16 ? 7 : n > 8 ? 2 : 1;
          series.forEach(function (r, i) { if ((n - 1 - i) % every === 0) out += '<text x="' + x(i) + '" y="' + (H - 6) + '" text-anchor="middle">' + dmy(r.day) + '</text>'; });
          out += '<line class="axis" x1="' + L + '" x2="' + (W - R) + '" y1="' + (T + ih) + '" y2="' + (T + ih) + '"/></svg>';
          return out;
        }
        function legend(keys) { return '<div class="legend">' + keys.map(function (k) { return '<span><i style="background:' + k.color + '"></i>' + esc(k.label) + '</span>'; }).join('') + '</div>'; }

        // ── gate / api ──────────────────────────────────────────────────
        function gate(msg) {
          app.innerHTML = '<div class="gate"><h1>Nidi HQ</h1><p>Tu clave, una vez por dispositivo.</p><input id="tok" type="password" autocomplete="current-password" placeholder="clave" /><div class="err" id="err">' + esc(msg || '') + '</div><button class="primary" id="go">Entrar</button></div>';
          var inp = document.getElementById('tok');
          function go() { var v = inp.value.trim(); if (!v) return; token = v; try { localStorage.setItem(KEY, v); } catch (e) {} load(); }
          document.getElementById('go').onclick = go;
          inp.onkeydown = function (e) { if (e.key === 'Enter') go(); };
          inp.focus();
        }
        function api(method, body) {
          return fetch(FN, { method: method, headers: { 'x-hq-token': token || '', 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined, credentials: 'omit', cache: 'no-store' })
            .then(function (r) { if (r.status === 401) throw new Error('unauthorized'); if (r.status === 503) throw new Error('no_token'); return r.json(); });
        }
        function load() {
          if (!DATA) app.innerHTML = '<p class="skeleton">Cargando…</p>';
          api('GET').then(function (d) { DATA = d; render(); }).catch(function (e) {
            if (e.message === 'unauthorized') { try { localStorage.removeItem(KEY); } catch (x) {} token = null; gate('Clave incorrecta.'); }
            else if (e.message === 'no_token') { try { localStorage.removeItem(KEY); } catch (x) {} token = null; gate('Todavía no hay clave en el servidor: creá HQ_TOKEN en Supabase → Edge Functions → Secrets.'); }
            else app.innerHTML = '<p class="skeleton warn">No se pudo cargar. <button class="link" onclick="location.reload()">Reintentar</button></p>';
          });
        }

        // ── render ──────────────────────────────────────────────────────
        var CONTACT_FILTER = 'all';
        function render() {
          var d = DATA, s = d.stats, f = s.funnel, m = s.money, w = s.web, inv = s.invites, ret = s.retention;
          var all = s.series || [], ser = all.slice(-range), prev = all.slice(-range * 2, -range);
          var today = all[all.length - 1] || {}, yest = all[all.length - 2] || {};
          var activeNidis = s.nidis.filter(function (n) { return n.status === 'active'; });
          var quiet = activeNidis.filter(function (n) { return n.quiet_days == null || n.quiet_days >= 2; });
          var kpi = function (k, v, dhtml, key, color, unit) {
            return '<div class="kpi"><div class="k">' + esc(k) + '</div><div class="v">' + v + (unit ? '<small>' + esc(unit) + '</small>' : '') + '</div><div class="d">' + (dhtml || '') + '</div>' + (key ? spark(ser, key, color || 'var(--olive)') : '') + '</div>';
          };
          var rangeLabel = range + ' días';
          var vsPrev = function (k) { return delta(sum(ser, k), sum(prev, k)) + ' <span class="quiet">vs ' + rangeLabel + ' anteriores</span>'; };

          var html = '<header><div><h1>Nidi HQ</h1><div class="sub">Día ' + s.days_since_launch + ' desde el lanzamiento · ' + esc(stamp(s.generated_at)) + ' · <button class="link" id="refresh">actualizar</button></div></div>'
            + '<div class="range" role="group" aria-label="Rango">' + [7, 14, 28].map(function (r) { return '<button data-range="' + r + '" aria-pressed="' + (r === range) + '">' + r + 'd</button>'; }).join('') + '</div></header>';

          // alerts
          html += '<div class="alerts">';
          // Only what asks for a move from Maru: quiet nidis and stale
          // invitations. A redeemed gift with no nidi yet is visible in the
          // gifts table (Maru, 2026-11-03: not worth seeing first).
          s.alerts = s.alerts.filter(function (a) { return a.kind !== 'redeemed_no_nidi'; });
          if (!s.alerts.length) html += '<div class="alert none"><span class="tag">OK</span>Nada que atender: los nidis activos comparten y no hay invitaciones viejas.</div>';
          s.alerts.forEach(function (a) { html += '<div class="alert ' + esc(a.kind) + '"><span class="tag">' + ({ quiet: 'Quieto', pending: 'Esperando', redeemed_no_nidi: 'Regalo sin nidi' })[a.kind] + '</span>' + esc(a.text) + '</div>'; });
          html += '</div>';

          // KPIs. A family is a nidi outside Maru's circle with BOTH homes
          // in (Maru, 2026-11-03): Fer + Andrea is one, Gise + Alejandro is
          // one. People with an account are not families yet.
          var pendingNidis = s.nidis.filter(function (n) { return n.status === 'pending'; });
          var famDelta = delta(sum(ser, 'activated'), sum(prev, 'activated'));
          html += '<h2>Hoy <small>comparado con ayer y con los ' + rangeLabel + ' anteriores</small></h2><div class="kpis">'
            + kpi('Familias', activeNidis.length, (pendingNidis.length ? '+' + pendingNidis.length + ' ' + plural(pendingNidis.length, 'esperando a la otra casa', 'esperando a la otra casa') + ' · ' : '') + 'nidis con las dos casas, sin tu familia', 'activated', 'var(--olive)')
            + kpi('Suscripciones', m.paid_active, '≈ USD ' + m.proceeds_usd_estimate + ' netos · Apple paga en enero')
            + kpi('Nidis gratis', m.gifts_redeemed, m.gifts_sent + ' códigos entregados · ' + (m.gifts_total - m.gifts_sent) + ' libres', null, null, 'de ' + m.gifts_sent)
            + kpi('Momentos de familias', s.moments.outside_total, 'hoy ' + (today.moments_outside || 0) + ' · ayer ' + (yest.moments_outside || 0) + '<br>' + delta(sum(ser, 'moments_outside'), sum(prev, 'moments_outside')) + ' <span class="quiet">vs antes</span>', 'moments_outside', 'var(--olive)')

          document.getElementById('refresh').onclick = load;
          document.getElementById('logout').onclick = function () { try { localStorage.removeItem(KEY); } catch (e) {} token = null; DATA = null; gate(); };
          Array.prototype.forEach.call(document.querySelectorAll('[data-range]'), function (b) { b.onclick = function () { range = Number(b.getAttribute('data-range')); try { localStorage.setItem(RANGE_KEY, String(range)); } catch (e) {} render(); }; });
          Array.prototype.forEach.call(document.querySelectorAll('[data-filter]'), function (b) { b.onclick = function () { CONTACT_FILTER = b.getAttribute('data-filter'); render(); }; });

          var cf = document.getElementById('contactform'), cdet = document.getElementById('contactdetails'), del = document.getElementById('contactdelete');
          cf.onsubmit = function (e) {
            e.preventDefault();
            var fd = new FormData(cf), body = { action: 'contact_upsert' };
            fd.forEach(function (v, k) { body[k] = v; });
            if (!body.id) delete body.id;
            document.getElementById('contactsave').disabled = true;
            api('POST', body).then(function (r) { if (!r.ok) throw new Error(r.error); load(); }).catch(function (err) { alert('No se guardó: ' + err.message); document.getElementById('contactsave').disabled = false; });
          };
          document.getElementById('contactclear').onclick = function () { cf.reset(); cf.id.value = ''; del.hidden = true; cdet.querySelector('summary').textContent = 'Agregar contacto'; };
          del.onclick = function () {
            if (!cf.id.value || !confirm('¿Borrar este contacto?')) return;
            api('POST', { action: 'contact_delete', id: cf.id.value }).then(function (r) { if (!r.ok) throw new Error(r.error); load(); }).catch(function (err) { alert('No se borró: ' + err.message); });
          };
          Array.prototype.forEach.call(document.querySelectorAll('[data-edit]'), function (b) {
            b.onclick = function () {
              var c = JSON.parse(b.getAttribute('data-edit'));
              cf.id.value = c.id; cf.name.value = c.name; cf.channel.value = c.channel; cf.kind.value = c.kind; cf.status.value = c.status; cf.sent_at.value = c.sent_at || ''; cf.note.value = c.note || '';
              del.hidden = false; cdet.open = true; cdet.querySelector('summary').textContent = 'Editando: ' + c.name;
              cdet.scrollIntoView({ behavior: 'smooth', block: 'start' });
              cf.status.focus();
            };
          });

          var pf = document.getElementById('campform'), pdet = document.getElementById('campdetails');
          pf.onsubmit = function (e) {
            e.preventDefault();
            var fd = new FormData(pf), body = { action: 'campaign_upsert', ct: fd.get('ct'), where_used: fd.get('where_used'), name: fd.get('name'), channel: fd.get('channel') };
            if (fd.get('downloads') !== '') body.downloads = Number(fd.get('downloads'));
            api('POST', body).then(function (r) { if (!r.ok) throw new Error(r.error); load(); }).catch(function (err) { alert('No se guardó: ' + err.message); });
          };
          Array.prototype.forEach.call(document.querySelectorAll('[data-camp]'), function (b) {
            b.onclick = function () { var c = JSON.parse(b.getAttribute('data-camp')); pf.name.value = c.name; pf.ct.value = c.ct; pf.channel.value = c.channel; pf.where_used.value = c.where_used; pf.downloads.value = c.downloads; pdet.open = true; pdet.scrollIntoView({ behavior: 'smooth', block: 'start' }); pf.downloads.focus(); };
          });
        }

        if (token) load(); else gate();
        document.addEventListener('visibilitychange', function () { if (!document.hidden && token && DATA) load(); });
      })();
    </script>
  </body>
</html>
