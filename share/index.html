<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 2026-11-19: the page behind the button of the mail «Tu invitación a
         {nombre} sigue pendiente» (nidi-app supabase/functions/dropout-recovery).
         It is opened by whoever made the nidi, never by the person invited:
         it reads the names with get_invite_share, which does not mark the
         invitation opened, and offers the phone's own share sheet with the
         same message the app shares (nidi-app lib/invite-share). Without a
         share sheet (a computer), the message and a Copy button.
         Not under /join/*, so it never opens the app. -->
    <title>Nidi</title>
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="origin" />
    <meta name="theme-color" content="#F4EFE7" />
    <style>
      @font-face { font-family: "Lora"; src: url(/assets/fonts/Lora-Regular.ttf) format("truetype"); font-weight: 400; font-display: swap; }
      @font-face { font-family: "Hanken Grotesk"; src: url(/assets/fonts/HankenGrotesk-Light.ttf) format("truetype"); font-weight: 300; font-display: swap; }
      @font-face { font-family: "Hanken Grotesk"; src: url(/assets/fonts/HankenGrotesk-Medium.ttf) format("truetype"); font-weight: 500; font-display: swap; }
      :root { --cream: #f4efe7; --paper: #fffdf9; --ink: #2a241d; --ink2: #7a6f62; --line: #e7dfd2;
        --serif: "Lora", Georgia, "Times New Roman", serif;
        --sans: "Hanken Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; background: var(--cream); color: var(--ink); }
      body { min-height: 100vh; min-height: 100dvh; display: grid; grid-template-rows: auto 1fr; font-family: var(--sans); -webkit-font-smoothing: antialiased; }
      header { padding: 24px max(24px, env(safe-area-inset-right)) 0 max(24px, env(safe-area-inset-left)); min-height: 68px; display: flex; align-items: center; }
      .wordmark { display: block; height: 15px; width: auto; }
      main { display: grid; align-content: center; justify-items: center; padding: 24px max(20px, env(safe-area-inset-right)) 48px max(20px, env(safe-area-inset-left)); }
      .card { width: 100%; max-width: 420px; background: var(--paper); border-radius: 20px; padding: 32px 24px; }
      h1 { font-family: var(--serif); font-weight: 400; font-size: 28px; line-height: 34px; margin: 0; text-wrap: balance; }
      p { font-weight: 300; font-size: 17px; line-height: 25px; margin: 12px 0 0; }
      .small { font-size: 14px; line-height: 20px; color: var(--ink2); }
      .primary { display: block; width: 100%; margin: 24px 0 0; font-family: var(--sans); font-weight: 500; font-size: 17px; line-height: 22px; color: var(--paper); background: var(--ink); border: 0; border-radius: 999px; padding: 15px 20px; cursor: pointer; }
      .primary:focus-visible { outline: 2px solid var(--ink2); outline-offset: 3px; }
      .msg { margin: 20px 0 0; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; font-size: 15px; line-height: 22px; font-weight: 300; overflow-wrap: anywhere; user-select: all; }
      [hidden] { display: none !important; }
    </style>
  </head>

    <main>
      <div class="card" aria-live="polite">
        <h1 id="title"></h1>
        <p id="lead"></p>
        <div id="msg" class="msg" hidden></div>
        <button id="go" class="primary" type="button" hidden></button>
        <p id="done" class="small" hidden></p>
      </div>
    </main>
    <script>
      (function () {
        var SUPABASE_URL = "https://orqdnuikcdskmvorchly.supabase.co";
        var SUPABASE_KEY = "sb_publishable_Rk1Ctdvv555TsKrMPVeFTg_rpHyh-EN";
        var q = new URLSearchParams(location.search);
        var lang = q.get("lang") === "en" ? "en" : q.get("lang") === "es" ? "es" : document.documentElement.lang === "es" ? "es" : "en";
        document.documentElement.lang = lang;
        var code = (q.get("c") || "").trim().toLowerCase();
        var es = lang === "es";
        function list(names) {
          var and = es ? " y " : " and ";
          if (names.length < 2) return names[0] || "";
          return names.slice(0, -1).join(", ") + and + names[names.length - 1];
        }
        // The same words as the app's share message (lib/invite-share, entry v6).
        function message(p) {
          var url = "https://nidi.life/join/" + (es ? "es/" : "") + "?c=" + encodeURIComponent(code) + "&lang=" + lang;
          var who = p.inviter_first_name || (es ? "Alguien" : "Someone");
          var kids = list(p.child_first_names || []);
          if (es) return kids ? who + " te invitó a Nidi, para estar cerca de " + kids + " todos los días. Toca el link para entrar: " + url
                              : who + " te invitó a Nidi. Toca el link para entrar: " + url;
          return kids ? who + " invited you to Nidi, to stay close to " + kids + " every day. Tap the link to come in: " + url
                      : who + " invited you to Nidi. Tap the link to come in: " + url;
        }
        var $ = function (id) { return document.getElementById(id); };
        function closed() {
          $("title").textContent = es ? "Este link ya no se puede usar." : "This link can no longer be used.";
          $("lead").textContent = es ? "Abre Nidi para mandar un link nuevo." : "Open Nidi to send a new link.";
        }
        function show(p) {
          var n = p.invitee_first_name;
          var text = message(p);
          $("title").textContent = n ? (es ? "Mándale el link a " + n + "." : "Send " + n + " the link.") : (es ? "Manda el link de tu nidi." : "Send your nidi's link.");
          var canShare = !!navigator.share;
          $("lead").textContent = canShare
            ? (es ? "Elige por dónde: WhatsApp, Mail o la app que uses." : "Choose where: WhatsApp, Mail or whichever app you use.")
            : (es ? "Copia este mensaje y mándalo por la app que uses." : "Copy this message and send it through whichever app you use.");
          var go = $("go");
          go.hidden = false;
          if (canShare) {
            go.textContent = es ? "Compartir el link" : "Share the link";
            go.onclick = function () {
              navigator.share({ text: text }).then(function () {
                $("done").hidden = false;
                $("done").textContent = n ? (es ? "Listo. Cuando " + n + " toque el link, entra directo a tu nidi." : "Done. When " + n + " taps the link, they go straight into your nidi.")
                                          : (es ? "Listo. Con el link se entra directo a tu nidi." : "Done. The link goes straight into your nidi.");
              }).catch(function () {});
            };
          } else {
            $("msg").hidden = false;
            $("msg").textContent = text;
            go.textContent = es ? "Copiar el mensaje" : "Copy the message";
            go.onclick = function () {
              var ok = function () { go.textContent = es ? "Copiado" : "Copied"; };
              if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok).catch(function () {});
            };
          }
        }
        $("title").textContent = es ? "Un momento…" : "One moment…";
        if (!code) { closed(); return; }
        fetch(SUPABASE_URL + "/rest/v1/rpc/get_invite_share", {
          method: "POST",
          headers: { "Content-Type": "application/json", apikey: SUPABASE_KEY },
          body: JSON.stringify({ p_code: code }),
          credentials: "omit",
        }).then(function (r) { return r.json(); }).then(function (p) {
          if (p && p.status === "open") show(p); else closed();
        }).catch(closed);
      })();
    </script>
  </body>
</html>
